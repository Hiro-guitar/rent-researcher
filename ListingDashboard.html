<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1e1e1e;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;font-size:14px;line-height:1.5}
a{color:#3498db;text-decoration:none}
.header{position:sticky;top:0;z-index:10;background:#252526;padding:12px 16px;border-bottom:1px solid #404040;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;font-weight:600}
.header-right{display:flex;gap:8px;align-items:center}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500}
.btn-primary{background:#3498db;color:#fff}
.btn-primary:hover{background:#2980b9}
.btn-ghost{background:transparent;color:#aaa;border:1px solid #555}
.btn-ghost:hover{background:#333}
.container{padding:12px 16px;margin:0 auto}

/* Alerts */
.alerts{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.alert{padding:8px 12px;border-radius:8px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px}
.alert-danger{background:rgba(231,76,60,.15);color:#e74c3c;border:1px solid rgba(231,76,60,.3)}
.alert-warning{background:rgba(243,156,18,.15);color:#f39c12;border:1px solid rgba(243,156,18,.3)}
.alert-info{background:rgba(52,152,219,.15);color:#3498db;border:1px solid rgba(52,152,219,.3)}
.alert .count{background:rgba(255,255,255,.15);padding:1px 6px;border-radius:10px;font-size:11px}
.alert-protect{background:rgba(46,204,113,.15);color:#2ecc71;border:1px solid rgba(46,204,113,.3);cursor:pointer;user-select:none}
.alert-protect.active{background:rgba(46,204,113,.3)}
.badge-protect{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700;background:rgba(46,204,113,.2);color:#2ecc71;white-space:nowrap}

/* Summary */
.summary{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.stat-card{background:#252526;border:1px solid #404040;border-radius:10px;padding:12px 16px;min-width:120px;flex:1}
.stat-card .label{font-size:11px;color:#888;margin-bottom:2px}
.stat-card .value{font-size:22px;font-weight:700}
.stat-card .sub{font-size:11px;color:#888;margin-top:2px}

/* Table */
.table-wrap{overflow:auto;max-height:78vh;background:#252526;border-radius:10px;border:1px solid #404040}
table{border-collapse:collapse;table-layout:auto;min-width:max-content}
thead th{position:sticky;top:0;z-index:2;background:#2d2d2d;padding:6px 8px;text-align:left;font-size:12px;color:#aaa;font-weight:600;cursor:pointer;user-select:none;border-bottom:1px solid #404040;white-space:nowrap;line-height:1.3;vertical-align:bottom}
/* 物件名(1列目)を左固定・ヘッダーを上固定。角(1行目1列目)は両方固定で最前面 */
thead th:first-child{left:0;z-index:3}
tbody td:first-child{position:sticky;left:0;z-index:1;background:#252526}
tbody tr:hover td:first-child{background:#2a2d35}
thead th:first-child,tbody td:first-child{border-right:1px solid #404040}
thead th:hover{color:#e0e0e0}
thead th.sorted-asc::after{content:' ▲';font-size:9px}
thead th.sorted-desc::after{content:' ▼';font-size:9px}
tbody tr{border-bottom:1px solid #333;cursor:pointer;transition:background .1s}
tbody tr:hover{background:#2a2d35}
tbody td{padding:6px 8px;font-size:13px;white-space:nowrap}
.text-right{text-align:right}
.text-center{text-align:center}
.text-muted{color:#888}
.text-danger{color:#e74c3c}
.text-success{color:#2ecc71}
.text-warning{color:#f39c12}

/* Sparkline */
.spark{display:inline-block;vertical-align:middle}

/* Transition rate bar */
.tr-bar{display:inline-block;width:50px;height:6px;background:#333;border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:4px}
.tr-bar-fill{height:100%;border-radius:3px}

/* Badge */
.badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:600}
.badge-danger{background:rgba(231,76,60,.2);color:#e74c3c}
.badge-warning{background:rgba(243,156,18,.2);color:#f39c12}
.badge-success{background:rgba(46,204,113,.2);color:#2ecc71}
.badge-info{background:rgba(52,152,219,.2);color:#3498db}

/* Detail panel */
#detailView{display:none}
.detail-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.detail-header h2{font-size:16px;font-weight:600}
.detail-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:16px}
.detail-stat{background:#2d2d2d;padding:10px 12px;border-radius:8px}
.detail-stat .label{font-size:11px;color:#888}
.detail-stat .value{font-size:18px;font-weight:700}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.chart-card{background:#2d2d2d;border-radius:10px;padding:14px;position:relative}
.chart-card h3{font-size:13px;color:#aaa;margin-bottom:8px}
.chart-tooltip{position:absolute;display:none;background:rgba(30,30,30,.95);border:1px solid #555;border-radius:6px;padding:8px 10px;font-size:11px;line-height:1.7;z-index:5;pointer-events:none;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.4)}
canvas{width:100%!important}

/* Sort select on mobile */
.sort-mobile{display:none}
@media(max-width:768px){
  .charts-row{grid-template-columns:1fr}
  .summary{flex-direction:column}
  .sort-mobile{display:block}
}

/* Loading */
.loading{text-align:center;padding:60px;color:#888}
.loading::after{content:'';display:block;width:32px;height:32px;margin:16px auto;border:3px solid #555;border-top-color:#3498db;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:#333;color:#e0e0e0;padding:10px 16px;border-radius:8px;font-size:13px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="header">
  <h1 id="pageTitle">掲載物件ダッシュボード</h1>
  <div class="header-right">
    <button class="btn btn-ghost" id="backBtn" style="display:none" onclick="showList()">← 一覧に戻る</button>
    <button class="btn btn-primary" onclick="refreshData()">更新</button>
  </div>
</div>

<div class="container">
  <!-- List view -->
  <div id="listView">
    <div class="loading" id="loadingMsg">データを読み込み中...</div>
    <div id="mainContent" style="display:none">
      <div class="alerts" id="alerts"></div>
      <div class="summary" id="summary"></div>
      <div class="charts-row" id="overviewCharts" style="grid-template-columns:1fr;margin-bottom:14px">
        <div class="chart-card"><h3>全物件 日次PV推移 + 問い合わせ</h3><canvas id="totalPvChart"></canvas></div>
      </div>
      <div class="table-wrap">
        <table>
          <colgroup>
            <col style="width:13%">
            <col style="width:4.5%">
            <col style="width:6.5%">
            <col style="width:4.5%">
            <col style="width:3%">
            <col style="width:3%">
            <col style="width:4%">
            <col style="width:3%">
            <col style="width:4%">
            <col style="width:4.5%">
            <col style="width:6%">
            <col style="width:4.5%">
            <col style="width:6%">
            <col style="width:4%">
            <col style="width:4.5%">
            <col style="width:4%">
            <col style="width:4.5%">
            <col style="width:3.5%">
            <col style="width:4.5%">
          </colgroup>
          <thead><tr id="tableHead"></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Detail view -->
  <div id="detailView">
    <div class="detail-header">
      <h2 id="detailTitle"></h2>
    </div>
    <div class="detail-stats" id="detailStats"></div>
    <div class="charts-row" style="grid-template-columns:1fr">
      <div class="chart-card"><h3>PV推移</h3><canvas id="pvChart"></canvas></div>
    </div>
    <div class="charts-row">
      <div class="chart-card"><h3>競合推移</h3><canvas id="compChart"></canvas></div>
      <div class="chart-card"><h3>遷移率推移（代表詳細PV÷代表一覧PV）</h3><canvas id="trChart"></canvas></div>
    </div>
    <div class="chart-card" id="inquiryDetail" style="margin-top:14px"><h3>問い合わせ一覧</h3><div id="inquiryList"></div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var G = {}; // global state
var sortCol = 'transitionRate';
var sortDir = 1;
var filterProtected = false; // 保護中のみ表示

var COLUMNS = [
  {key:'name',label:'物件名',align:'left',fmt:function(l){return (l.protected?'<span class="badge-protect" title="自動落とし対象外: '+(l.protectReason||'')+'">🛡保護</span> ':'')+l.name+(l.room?' '+l.room:'')}},
  {key:'totalFee',label:'賃料+管理費',align:'right'},
  {key:'lineName',label:'路線',align:'left'},
  {key:'stationName',label:'駅',align:'left'},
  {key:'walk',label:'徒歩',align:'right'},
  {key:'area',label:'面積',align:'right'},
  {key:'layout',label:'間取り',align:'left'},
  {key:'buildingAge',label:'築年数',align:'right'},
  {key:'listedDays',label:'掲載日数(データ取得時)',align:'right'},
  {key:'repListPv',label:'代表物件合計一覧PV',align:'right',fmt:function(l){return sparkHtml(l._pvRepListSpark)+num(l.repListPv)}},
  {key:'dailyListPv',label:'代表物件一覧PV（平均）',align:'right',fmt:function(l){
    return l.dailyListPv!=null?l.dailyListPv.toFixed(2):'-';
  }},
  {key:'repDetailPv',label:'代表物件合計詳細PV',align:'right',fmt:function(l){return sparkHtml(l._pvRepDetailSpark)+num(l.repDetailPv)}},
  {key:'dailyDetailPv',label:'代表物件詳細PV（平均）',align:'right',fmt:function(l){
    return l.dailyDetailPv!=null?l.dailyDetailPv.toFixed(2):'-';
  }},
  {key:'transitionRate',label:'遷移率',align:'right',fmt:function(l){
    if(l.transitionRate==null) return '<span class="text-muted">-</span>';
    var pct = (l.transitionRate*100).toFixed(1);
    var cls = l.transitionRate>=0.5?'#2ecc71':l.transitionRate>=0.3?'#f39c12':'#e74c3c';
    return '<span class="tr-bar"><span class="tr-bar-fill" style="width:'+Math.min(pct,100)+'%;background:'+cls+'"></span></span>'+pct+'%';
  }},
  {key:'listPv',label:'合計一覧PV',align:'right',fmt:function(l){return sparkHtml(l._pvListSpark)+num(l.listPv)}},
  {key:'totalDailyListPv',label:'合計一覧PV（平均）',align:'right',fmt:function(l){
    return l.totalDailyListPv!=null?l.totalDailyListPv.toFixed(2):'-';
  }},
  {key:'detailPv',label:'合計詳細PV',align:'right',fmt:function(l){return sparkHtml(l._pvDetailSpark)+num(l.detailPv)}},
  {key:'totalDailyDetailPv',label:'合計詳細PV（平均）',align:'right',fmt:function(l){
    return l.totalDailyDetailPv!=null?l.totalDailyDetailPv.toFixed(2):'-';
  }},
  {key:'_inquiryCount',label:'問い合わせ',align:'right',fmt:function(l){
    var c=l._inquiryCount||0;return c>0?'<span style="color:#e67e22;font-weight:600">'+c+'</span>':'0';
  }},
  {key:'weightedComp',label:'競合(加重)',align:'right',fmt:function(l){
    if(l.weightedComp==null) return '<span class="text-muted">-</span>';
    var trend = l._compTrend;
    var arrow = trend>0?'<span class="text-danger"> +'+trend+'</span>':trend<0?'<span class="text-success"> '+trend+'</span>':'';
    return l.weightedComp.toFixed(1)+arrow;
  }},
];

function num(n){return n?n.toLocaleString():'-'}

function sparkHtml(vals){
  if(!vals||vals.length<2) return '';
  var mn=Infinity,mx=-Infinity;
  for(var i=0;i<vals.length;i++){if(vals[i]!=null){if(vals[i]<mn)mn=vals[i];if(vals[i]>mx)mx=vals[i]}}
  if(mn===mx){mn-=1;mx+=1}
  var w=32,h=14,points=[];
  for(var j=0;j<vals.length;j++){
    var v=vals[j]!=null?vals[j]:mn;
    var x=(j/(vals.length-1))*w;
    var y=h-((v-mn)/(mx-mn))*h;
    points.push(x.toFixed(1)+','+y.toFixed(1));
  }
  return '<svg class="spark" width="'+w+'" height="'+h+'" style="margin-right:4px"><polyline points="'+points.join(' ')+'" fill="none" stroke="#3498db" stroke-width="1.5"/></svg>';
}

function showToast(msg){
  var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},3000);
}

function refreshData(){
  document.getElementById('loadingMsg').style.display='';
  document.getElementById('mainContent').style.display='none';
  google.script.run
    .withSuccessHandler(function(d){G=d;enrichData();renderList();})
    .withFailureHandler(function(e){showToast('エラー: '+e.message);document.getElementById('loadingMsg').textContent='読み込みに失敗しました';})
    .getListingDashboardData();
}

// 電話問い合わせを手動追加（詳細パネルのフォームから）
function addPhoneInquiry(){
  var code=window._detailCode;
  var l=null;
  for(var i=0;i<G.listings.length;i++){if(G.listings[i].suumoCode===code){l=G.listings[i];break}}
  if(!l){showToast('物件が特定できません');return}
  var prop=l.name+(l.room?' '+l.room:'');
  var name=(document.getElementById('inqName').value||'').trim();
  var phone=(document.getElementById('inqPhone').value||'').trim();
  var memo=(document.getElementById('inqMemo').value||'').trim();
  var btn=document.getElementById('inqAddBtn');
  btn.disabled=true;btn.textContent='追加中...';
  google.script.run
    .withSuccessHandler(function(r){
      if(r&&r.success){
        showToast('問い合わせを追加しました');
        // データ再取得して詳細を開き直す（件数・一覧を反映）
        google.script.run
          .withSuccessHandler(function(d){G=d;enrichData();renderList();showDetail(code);})
          .withFailureHandler(function(e){showToast('再読み込み失敗: '+e.message);})
          .getListingDashboardData();
      }else{
        btn.disabled=false;btn.textContent='＋ 追加';
        showToast('失敗: '+((r&&r.message)||'不明なエラー'));
      }
    })
    .withFailureHandler(function(e){btn.disabled=false;btn.textContent='＋ 追加';showToast('エラー: '+e.message);})
    .addManualInquiry(prop,name,phone,memo);
}

// 物件名の正規化（全角英数→半角、空白・号室・号の除去、小文字化）。
// 問い合わせシートの物件名は自由記述なので、掲載側の建物名と突き合わせるために使う。
function normProp(s){
  return String(s||'')
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g,function(ch){return String.fromCharCode(ch.charCodeAt(0)-0xFEE0);})
    .replace(/[\s　]/g,'')
    .replace(/号室|号/g,'')
    .toLowerCase();
}

function enrichData(){
  var pv=G.pvHistory||{dates:[],properties:{}};
  var comp=G.compHistory||{dates:[],properties:{}};
  var pvDates=pv.dates||[];
  var compDates=comp.dates||[];

  for(var i=0;i<G.listings.length;i++){
    var l=G.listings[i];
    var code=l.suumoCode;

    // PV sparkline (last 7 days)
    var pp=pv.properties[code]||{};
    var detPv=pp['詳細PV']||[];
    var listPvH=pp['一覧PV']||[];
    var repListPvH=pp['代表一覧PV']||[];
    var repDetPvH=pp['代表詳細PV']||[];
    l._pvDetailSpark=detPv.slice(-7);
    l._pvListSpark=listPvH.slice(-7);
    l._pvRepListSpark=repListPvH.slice(-7);
    l._pvRepDetailSpark=repDetPvH.slice(-7);

    // PV drop alert: last 3 days avg vs previous 7 days avg
    l._pvDrop=false;
    if(detPv.length>=10){
      var recent=avg(detPv.slice(-3));
      var prev=avg(detPv.slice(-10,-3));
      if(prev>0&&recent/prev<0.5) l._pvDrop=true;
    }

    // Competition trend: latest vs 7 days ago
    var c1=(comp.properties[code]||{})['競合_第1']||[];
    l._compTrend=0;
    if(c1.length>=7){
      var latest=lastNonNull(c1);
      var prev7=lastNonNull(c1.slice(0,-7));
      if(latest!=null&&prev7!=null) l._compTrend=latest-prev7;
    }
    l._compSurge=l._compTrend>=5;

    // Transition rate drop
    l._trLow=l.transitionRate!=null&&l.transitionRate<0.3&&l.listPv>=20;

    // Inquiry data per property: 問い合わせシートの物件名は自由記述（建物名のみ/全角/号室付き等）
    // なので正規化して建物名（＋部屋番号）ベースで突き合わせる。
    var nName=normProp(l.name), nRoom=normProp(l.room), nFull=nName+nRoom;
    var inqs=G.inquiries||[];
    l._inquiryList=[];
    for(var qi=0;qi<inqs.length;qi++){
      var np=normProp(inqs[qi].property);
      if(!np||!nName) continue;
      var m=false;
      if(np===nFull) m=true;                 // 建物+部屋 完全一致
      else if(np===nName) m=true;            // 建物のみ一致（問い合わせに部屋番号なし）
      else if(np.indexOf(nName)===0){        // 問い合わせ名が建物名で始まる
        var rest=np.slice(nName.length);
        // 部屋番号があれば残りに含まれることを要求（別部屋・別建物への誤マッチ防止）
        if(!nRoom || rest.indexOf(nRoom)>=0) m=true;
      }
      if(m) l._inquiryList.push(inqs[qi]);
    }
    l._inquiryCount=l._inquiryList.length;
  }
}

function avg(arr){var s=0,c=0;for(var i=0;i<arr.length;i++){if(arr[i]!=null){s+=arr[i];c++}}return c?s/c:0}
function lastNonNull(arr){for(var i=arr.length-1;i>=0;i--){if(arr[i]!=null)return arr[i]}return null}

function renderList(){
  document.getElementById('loadingMsg').style.display='none';
  document.getElementById('mainContent').style.display='';

  // Alerts
  var pvDrops=G.listings.filter(function(l){return l._pvDrop});
  var compSurges=G.listings.filter(function(l){return l._compSurge});
  var trLows=G.listings.filter(function(l){return l._trLow});
  var protectedList=G.listings.filter(function(l){return l.protected});
  var alertsHtml='';
  if(pvDrops.length) alertsHtml+='<div class="alert alert-danger">⚠ PV急落 <span class="count">'+pvDrops.length+'件</span></div>';
  if(compSurges.length) alertsHtml+='<div class="alert alert-warning">⚠ 競合急増 <span class="count">'+compSurges.length+'件</span></div>';
  if(trLows.length) alertsHtml+='<div class="alert alert-info">⚠ 遷移率低下 <span class="count">'+trLows.length+'件</span></div>';
  alertsHtml+='<div class="alert alert-protect'+(filterProtected?' active':'')+'" id="protectChip" title="PVデータ収集中で自動落とし対象外の物件。クリックで絞り込み">🛡 保護中（自動落とし対象外）<span class="count">'+protectedList.length+'件</span></div>';
  document.getElementById('alerts').innerHTML=alertsHtml;
  var _pc=document.getElementById('protectChip');
  if(_pc)_pc.onclick=function(){filterProtected=!filterProtected;renderList();};

  // Summary
  var ls=G.listings;
  var avgDailyDetail=avg(ls.filter(function(l){return l.dailyDetailPv!=null}).map(function(l){return l.dailyDetailPv}));
  var avgComp=avg(ls.filter(function(l){return l.weightedComp!=null}).map(function(l){return l.weightedComp}));
  var avgTr=avg(ls.filter(function(l){return l.transitionRate!=null}).map(function(l){return l.transitionRate*100}));
  document.getElementById('summary').innerHTML=
    '<div class="stat-card"><div class="label">掲載中</div><div class="value">'+ls.length+'<span style="font-size:13px;color:#888"> 件</span></div></div>'+
    '<div class="stat-card"><div class="label">平均 代表詳細PV（平均）</div><div class="value">'+avgDailyDetail.toFixed(2)+'</div></div>'+
    '<div class="stat-card"><div class="label">平均競合(加重)</div><div class="value">'+avgComp.toFixed(1)+'</div></div>'+
    '<div class="stat-card"><div class="label">平均遷移率</div><div class="value">'+avgTr.toFixed(1)+'<span style="font-size:13px;color:#888">%</span></div></div>';

  // Table head
  var th='';
  for(var c=0;c<COLUMNS.length;c++){
    var col=COLUMNS[c];
    var cls=sortCol===col.key?(sortDir>0?'sorted-asc':'sorted-desc'):'';
    th+='<th class="'+cls+'" data-key="'+col.key+'">'+col.label+'</th>';
  }
  document.getElementById('tableHead').innerHTML=th;

  // Sort（保護フィルタ適用）
  var visible=filterProtected?ls.filter(function(l){return l.protected}):ls;
  var sorted=visible.slice().sort(function(a,b){
    var va=a[sortCol],vb=b[sortCol];
    if(va==null)va=sortDir>0?Infinity:-Infinity;
    if(vb==null)vb=sortDir>0?Infinity:-Infinity;
    if(typeof va==='string')return sortDir*(va<vb?-1:va>vb?1:0);
    return sortDir*(va-vb);
  });

  // Table body
  var tb='';
  for(var r=0;r<sorted.length;r++){
    var l=sorted[r];
    // PV下落/競合急増インジケータは固定される1列目セルに付ける（右スクロールでも常に見える）
    var indicator=l._pvDrop?'border-left:3px solid #e74c3c':l._compSurge?'border-left:3px solid #f39c12':'';
    tb+='<tr data-code="'+l.suumoCode+'">';
    for(var c2=0;c2<COLUMNS.length;c2++){
      var col2=COLUMNS[c2];
      var val=col2.fmt?col2.fmt(l):(l[col2.key]!=null?l[col2.key]:'-');
      var tdStyle=(c2===0&&indicator)?' style="'+indicator+'"':'';
      tb+='<td class="'+(col2.align==='right'?'text-right':'')+'"'+tdStyle+'>'+val+'</td>';
    }
    tb+='</tr>';
  }
  document.getElementById('tableBody').innerHTML=tb;

  // Click handlers
  document.querySelectorAll('#tableHead th').forEach(function(el){
    el.onclick=function(){
      var k=el.getAttribute('data-key');
      if(sortCol===k){sortDir*=-1}else{sortCol=k;sortDir=-1}
      renderList();
    };
  });
  document.querySelectorAll('#tableBody tr').forEach(function(el){
    el.onclick=function(){showDetail(el.getAttribute('data-code'))};
  });

  // Aggregate daily PV chart (active + stopped all properties)
  var pvDates=(G.pvHistory||{}).dates||[];
  if(pvDates.length>0){
    var totalRepList=[];var totalRepDetail=[];
    for(var di=0;di<pvDates.length;di++){totalRepList.push(0);totalRepDetail.push(0)}
    var props=(G.pvHistory||{}).properties||{};
    for(var code in props){
      var pp=props[code];
      var rl=pp['代表一覧PV']||[];
      var rd=pp['代表詳細PV']||[];
      for(var di2=0;di2<pvDates.length;di2++){
        if(rl[di2]!=null)totalRepList[di2]+=rl[di2];
        if(rd[di2]!=null)totalRepDetail[di2]+=rd[di2];
      }
    }
    // Daily inquiry counts aligned to pvDates
    var inqs=G.inquiries||[];
    var dailyInq={};
    for(var iq=0;iq<inqs.length;iq++){
      var d=inqs[iq].date.slice(0,10);
      dailyInq[d]=(dailyInq[d]||0)+1;
    }
    var inqVals=[];
    for(var di3=0;di3<pvDates.length;di3++){
      inqVals.push(dailyInq[pvDates[di3]]||0);
    }

    document.getElementById('overviewCharts').style.display='';
    drawLineChart('totalPvChart',pvDates,[
      {data:totalRepList,color:'#3498db',label:'一覧PV合計'},
      {data:totalRepDetail,color:'#2ecc71',label:'詳細PV合計',rightAxis:true},
      {data:inqVals,color:'#e67e22',label:'問い合わせ数',rightAxis:2,dashed:true}
    ],{height:240});
  }else{
    document.getElementById('overviewCharts').style.display='none';
  }
}

    {data:pp['一覧PV']||[],color:'#85c1e9',label:'合計一覧PV',dashed:true},

function showList(){

  document.getElementById('detailView').style.display='none';
  document.getElementById('backBtn').style.display='none';

function drawLineChart(canvasId,dates,series,opts){
  opts=opts||{};
  var canvas=document.getElementById(canvasId);
  canvas._chartArgs={dates:dates,series:series,opts:opts};
  renderChart_(canvas,-1);
  if(!canvas._hoverBound){
    canvas._hoverBound=true;
    var tip=document.createElement('div');
    tip.className='chart-tooltip';
    canvas.parentElement.appendChild(tip);
    canvas.addEventListener('mousemove',function(e){
      var m=canvas._chartMeta;if(!m)return;
      var rect=canvas.getBoundingClientRect();
      var mx=e.clientX-rect.left;
      if(mx<m.pad.l||mx>m.pad.l+m.cw){tip.style.display='none';return}
      var ratio=(mx-m.pad.l)/m.cw;
      var idx=Math.round(ratio*(m.dates.length-1));
      idx=Math.max(0,Math.min(m.dates.length-1,idx));
      if(canvas._lastHl===idx)return;
      canvas._lastHl=idx;
      renderChart_(canvas,idx);
      var a=canvas._chartArgs;
      var dp2=m.dates[idx].split('-');
      var dow2=['日','月','火','水','木','金','土'][new Date(+dp2[0],+dp2[1]-1,+dp2[2]).getDay()];
      var html='<div style="font-weight:600;margin-bottom:2px;color:#eee">'+m.dates[idx]+'('+dow2+')</div>';
      for(var s=0;s<a.series.length;s++){
        var v=a.series[s].data[idx];
        var vs=v!=null?(a.opts.decimals?v.toFixed(a.opts.decimals):String(v)):'-';
        html+='<div><span style="color:'+a.series[s].color+'">●</span> '+a.series[s].label+': <b>'+vs+'</b></div>';
      }
      tip.innerHTML=html;tip.style.display='block';
      var tipW=tip.offsetWidth;var tipLeft=mx+16;
      if(tipLeft+tipW>m.W-10)tipLeft=mx-tipW-16;
      tip.style.left=tipLeft+'px';
      tip.style.top=Math.max(0,(e.clientY-rect.top)-20)+'px';
    });
    canvas.addEventListener('mouseleave',function(){
      tip.style.display='none';canvas._lastHl=-1;
      renderChart_(canvas,-1);
    });
  }
}

function renderChart_(canvas,hlIdx){
  var a=canvas._chartArgs;if(!a)return;
  var dates=a.dates,series=a.series,opts=a.opts;
  var ctx=canvas.getContext('2d');
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.parentElement.getBoundingClientRect();
  var W=rect.width-28;
  var H=opts.height||260;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H);

  if(!dates||dates.length===0){
    ctx.fillStyle='#888';ctx.font='13px -apple-system,sans-serif';ctx.textAlign='center';
    ctx.fillText('データなし',W/2,H/2);return;
  }

  // Axis groups: 0=left, 1=right, 2=right2, ...
  var axes={};
  for(var s=0;s<series.length;s++){
    var ag=0;
    if(series[s].rightAxis===true||series[s].rightAxis===1)ag=1;
    else if(series[s].rightAxis)ag=Number(series[s].rightAxis)||0;
    series[s]._ag=ag;
    if(!axes[ag])axes[ag]={mn:Infinity,mx:-Infinity,color:series[s].color};
    var d=series[s].data;
    for(var i=0;i<d.length;i++){
      if(d[i]!=null){if(d[i]<axes[ag].mn)axes[ag].mn=d[i];if(d[i]>axes[ag].mx)axes[ag].mx=d[i]}
    }
  }
  function niceStep_(v){
    if(v<=0)return 1;
    var e=Math.floor(Math.log10(v)),p=Math.pow(10,e),f=v/p;
    if(f<=1)return p;if(f<=2)return 2*p;if(f<=5)return 5*p;return 10*p;
  }
  var agKeys=Object.keys(axes).map(Number).sort();
  for(var ai=0;ai<agKeys.length;ai++){
    var ax=axes[agKeys[ai]];
    if(ax.mn===Infinity){ax.mn=0;ax.mx=1}
    if(ax.mn===ax.mx){ax.mn=Math.max(0,ax.mn-1);ax.mx=ax.mx+1}
    var step=niceStep_((ax.mx-ax.mn)/5);
    ax.mn=Math.floor(ax.mn/step)*step;
    if(ax.mn<0)ax.mn=0;
    ax.mx=Math.ceil(ax.mx/step)*step;
    if(ax.mx<=ax.mn)ax.mx=ax.mn+step;
    ax.range=ax.mx-ax.mn;ax.step=step;ax.ticks=Math.round(ax.range/step);
  }
  var rightCount=agKeys.filter(function(k){return k>0}).length;

  var pad={t:28,r:55+Math.max(0,rightCount-1)*44,b:32,l:44};
  var cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;

  canvas._chartMeta={pad:pad,cw:cw,ch:ch,axes:axes,dates:dates,W:W,H:H};

  // Grid lines (based on left axis ticks)
  ctx.strokeStyle='#333';ctx.lineWidth=0.5;
  var gridN=axes[0]?axes[0].ticks:5;
  for(var g=0;g<=gridN;g++){
    var gy=pad.t+ch-(g/gridN)*ch;
    ctx.beginPath();ctx.moveTo(pad.l,gy);ctx.lineTo(pad.l+cw,gy);ctx.stroke();
  }
  // Left axis labels (group 0)
  if(axes[0]){
    ctx.fillStyle=rightCount>0?axes[0].color:'#666';
    ctx.font='10px -apple-system,sans-serif';ctx.textAlign='right';
    var lt=axes[0].ticks;
    for(var g=0;g<=lt;g++){
      var gy=pad.t+ch-(g/lt)*ch;
      var gv=axes[0].mn+g*axes[0].step;
      ctx.fillText(opts.decimals?gv.toFixed(opts.decimals):Math.round(gv),pad.l-6,gy+3);
    }
  }
  // Right axis labels
  var ri=0;
  for(var ai=0;ai<agKeys.length;ai++){
    if(agKeys[ai]===0)continue;
    var ax=axes[agKeys[ai]];
    ctx.fillStyle=ax.color;ctx.font='10px -apple-system,sans-serif';ctx.textAlign='left';
    var rt=ax.ticks;
    for(var g=0;g<=rt;g++){
      var gy=pad.t+ch-(g/rt)*ch;
      var gv=ax.mn+g*ax.step;
      ctx.fillText(opts.decimals?gv.toFixed(opts.decimals):Math.round(gv),pad.l+cw+6+ri*44,gy+3);
    }
    ri++;
  }

  // X axis
  var DOW=['日','月','火','水','木','金','土'];
  ctx.font='10px -apple-system,sans-serif';ctx.textAlign='center';
  var dateStep=Math.max(1,Math.floor(dates.length/7));
  for(var xi=0;xi<dates.length;xi+=dateStep){
    var xx=pad.l+(xi/(dates.length-1||1))*cw;
    var dp=dates[xi].split('-');
    var dow=new Date(+dp[0],+dp[1]-1,+dp[2]).getDay();
    var dowLabel=DOW[dow];
    ctx.fillStyle=(dow===0)?'#e74c3c':(dow===6)?'#3498db':'#666';
    ctx.fillText(dp[1]+'/'+dp[2]+'('+dowLabel+')',xx,H-4);
  }

  // Crosshair
  if(hlIdx>=0&&hlIdx<dates.length){
    var hx=pad.l+(hlIdx/(dates.length-1||1))*cw;
    ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(hx,pad.t);ctx.lineTo(hx,pad.t+ch);ctx.stroke();
  }

  // Series
  for(var si=0;si<series.length;si++){
    var ser=series[si];
    var sAx=axes[ser._ag]||axes[0];var sMn=sAx.mn,sRange=sAx.range;
    var pts=[];
    for(var di=0;di<ser.data.length;di++){
      if(ser.data[di]==null)continue;
      pts.push({x:pad.l+(di/(dates.length-1||1))*cw,y:pad.t+ch-((ser.data[di]-sMn)/sRange)*ch,v:ser.data[di],idx:di});
    }
    if(pts.length===0)continue;

    // Gradient fill
    if(!ser.dashed&&pts.length>=2){
      var grad=ctx.createLinearGradient(0,pad.t,0,pad.t+ch);
      grad.addColorStop(0,ser.color+'30');grad.addColorStop(1,ser.color+'05');
      ctx.fillStyle=grad;ctx.beginPath();
      ctx.moveTo(pts[0].x,pad.t+ch);
      for(var fi=0;fi<pts.length;fi++)ctx.lineTo(pts[fi].x,pts[fi].y);
      ctx.lineTo(pts[pts.length-1].x,pad.t+ch);ctx.closePath();ctx.fill();
    }

    // Line
    ctx.strokeStyle=ser.color;ctx.lineWidth=ser.dashed?1.5:2;
    if(ser.dashed)ctx.setLineDash([5,3]);else ctx.setLineDash([]);
    ctx.beginPath();
    for(var li=0;li<pts.length;li++){
      if(li===0)ctx.moveTo(pts[li].x,pts[li].y);else ctx.lineTo(pts[li].x,pts[li].y);
    }
    ctx.stroke();ctx.setLineDash([]);

    // Last point dot + value label
    var lp=pts[pts.length-1];
    ctx.fillStyle=ser.color;ctx.beginPath();ctx.arc(lp.x,lp.y,3.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#2d2d2d';ctx.lineWidth=1.5;ctx.stroke();
    if(rightCount===0){
      ctx.fillStyle=ser.color;ctx.font='bold 10px -apple-system,sans-serif';ctx.textAlign='left';
      ctx.fillText(opts.decimals?lp.v.toFixed(opts.decimals):String(lp.v),pad.l+cw+6,lp.y+3);
    }

    // Highlight dot
    if(hlIdx>=0&&ser.data[hlIdx]!=null){
      var hy=pad.t+ch-((ser.data[hlIdx]-sMn)/sRange)*ch;
      var hdx=pad.l+(hlIdx/(dates.length-1||1))*cw;
      ctx.fillStyle=ser.color;ctx.beginPath();ctx.arc(hdx,hy,5,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    }
  }

  // Legend
  ctx.font='11px -apple-system,sans-serif';
  var lx=pad.l;
  for(var lei=0;lei<series.length;lei++){
    ctx.strokeStyle=series[lei].color;ctx.lineWidth=2;
    if(series[lei].dashed)ctx.setLineDash([4,2]);else ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(lx,12);ctx.lineTo(lx+14,12);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=series[lei].color;ctx.beginPath();ctx.arc(lx+7,12,2.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#bbb';ctx.textAlign='left';
    ctx.fillText(series[lei].label,lx+18,15);
    lx+=ctx.measureText(series[lei].label).width+32;
  }
}

refreshData();
