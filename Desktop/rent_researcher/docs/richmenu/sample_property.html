<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1040px}
body{background:#eef1f4;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;padding:36px}
.lead{font-size:38px;font-weight:600;color:#444;text-align:center;margin-bottom:24px;letter-spacing:.02em}
.card{background:#fff;border:2px solid #e6e8ea;border-radius:22px;overflow:hidden}
.strip{display:grid;grid-template-columns:2.95fr 1fr;grid-template-rows:654px;height:654px;overflow:hidden;background:#fff}
.plan{background:#fff;overflow:hidden;min-height:0;min-width:0}
.plan img{width:100%;height:100%;object-fit:contain;padding:14px}

.photos{display:grid;grid-template-rows:1fr 1fr 1fr;gap:4px;background:#fff;min-height:0;overflow:hidden}
.ph{overflow:hidden;min-height:0;min-width:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}




.body{padding:30px 34px 34px}
.name{font-size:46px;font-weight:700;color:#1a2538;margin-bottom:14px}
.rent{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.rent b{font-size:70px;color:#d0342c;font-weight:700;line-height:1}
.rent i{font-style:normal;font-size:28px;color:#555}
.sub{font-size:28px;color:#444;line-height:1.5}
.pills{display:flex;gap:16px;margin:22px 0 4px}
.pill{background:#eef5e4;color:#3d6909;border-radius:999px;padding:12px 26px;font-size:27px;font-weight:600}
.hr{height:2px;background:#eceff1;margin:24px 0}
.addr{font-size:28px;color:#222;line-height:1.6}
.dim{color:#9aa3ab;font-size:25px;margin-top:6px}
.memo{background:#fdf6e6;border-radius:14px;padding:22px 24px;margin-top:24px}
.memo .t{color:#c98a2e;font-size:26px;font-weight:700;margin-bottom:8px}
.memo .b{font-size:27px;color:#3f3a31;line-height:1.55}
.btn{margin-top:28px;background:#7cb342;color:#fff;border-radius:12px;text-align:center;padding:26px;font-size:32px;font-weight:600}
</style></head><body>
<div class="lead">お送りするお部屋の例</div>
<div class="card">
  <div class="strip">
    <div class="plan"><img src="src/madori.jpg" alt=""></div>
    <div class="photos">
      <div class="ph"><img src="src/gaikan.jpg" alt="" style="object-position:50% 50%"></div>
      <div class="ph"><img src="src/shitsunai.jpg" alt="" style="object-position:50% 55%"></div>
      <div class="ph"><img src="src/yokushitsu.jpg" alt="" style="object-position:50% 55%"></div>
    </div>
  </div>
  <div class="body">
    <div class="name">サンプルマンション 301</div>
    <div class="rent"><b>9.8万円</b><i>/ 月</i></div>
    <div class="sub">管理費 5,000円<br>敷金 1ヶ月 / 礼金 1ヶ月</div>
    <div class="pills"><div class="pill">1LDK</div><div class="pill">40.00m²</div><div class="pill">築12年</div></div>
    <div class="hr"></div>
    <div class="addr">東京都杉並区阿佐谷北2丁目<br>ＪＲ中央線「阿佐ケ谷」駅 徒歩5分
      <div class="dim">その他の路線<br>東京メトロ丸ノ内線「南阿佐ケ谷」駅 徒歩9分</div>
    </div>
    <div class="memo"><div class="t">💬 担当者より</div>
      <div class="b">日当たりが良く、収納も多いお部屋です。</div></div>
    <div class="btn">物件詳細を見る</div>
  </div>
</div>
</body></html>
