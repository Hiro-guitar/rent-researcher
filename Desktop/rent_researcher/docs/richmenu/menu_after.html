<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e9e9e9;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;overflow:hidden}
.grid{display:grid;gap:22px;padding:22px;width:100%;height:100%}
.tile{position:relative;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow:hidden}
.tile.w{background:#fff;border:14px solid #8dc63f;color:#333}
.tile.g{background:#8dc63f;border:14px solid #8dc63f;color:#fff}
.tile.g .in{border:4px solid #fff;border-radius:6px;position:absolute;inset:6px}
.tile.w .in{border:4px solid #8dc63f;border-radius:6px;position:absolute;inset:6px}
.tile svg{width:260px;height:260px}
.tile .t{font-size:84px;letter-spacing:.06em;text-align:center;line-height:1.25;font-weight:500}
.corner{position:absolute;right:18px;bottom:18px;width:0;height:0;border-left:70px solid transparent;border-bottom:70px solid #8dc63f}
.tile.g .corner{border-bottom-color:#fff}

oke-linejoin="round"/><path d="M42 78 A8 8 0 0 0 58 78" fill="none" stroke="currentColor" stroke-width="6"/><circle cx="50" cy="10" r="4" fill="currentColor"/></svg><div class="t">配信の停止/再開</div><div class="corner"></div></div><div class="tile w"><div class="in"></div><svg viewBox="0 0 100 100"><text x="50" y="72" text-anchor="middle" font-size="72" font-family="Hiragino Sans" font-weight="600" fill="currentColor">?</text></svg><div class="t">使い方</div><div class="corner"></div></div></div></body></html>
