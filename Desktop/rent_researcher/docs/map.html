<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お部屋マップ</title>
<link rel="preconnect" href="https://ehomaki-img.delicate-bush-f5a9.workers.dev" crossorigin>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="dns-prefetch" href="https://script.google.com">
<!-- 地図は Leaflet + OpenStreetMap。APIキーも課金アカウントも要らない。 -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f8f9fa;color:#333;display:flex;flex-direction:column}
header{background:#fff;padding:14px 16px;border-bottom:1px solid #eee;flex:none}
header h1{font-size:16px;font-weight:700;color:#1a2538}
header .sub{font-size:12px;color:#888;margin-top:3px}
#map{flex:1;min-width:0;min-height:0;background:#e8eaed}
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:#888;padding:24px;text-align:center}
.state .spinner{width:38px;height:38px;border:3px solid #e8f0d8;border-top-color:#6ea814;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.state h2{font-size:16px;color:#1a2538;margin-bottom:8px}
.state p{font-size:13px;line-height:1.7}
/* ピン。OSMの地図は緑と薄茶が多いので、緑の丸だと埋もれる。
   しずく型＋白フチ＋濃い影で、地図の上に浮いて見えるようにする。 */
.pin{width:26px;height:26px;background:#E5533D;border:3px solid #fff;
  border-radius:50% 50% 50% 0;transform:rotate(-45deg);
  box-shadow:0 3px 8px rgba(0,0,0,.45);transition:transform .12s;
  position:absolute;left:50%;top:50%;margin:-13px 0 0 -13px}
.pin::after{content:"";position:absolute;left:50%;top:50%;
  width:8px;height:8px;margin:-4px 0 0 -4px;background:#fff;border-radius:50%}
/* 同じ建物に複数のお部屋があるピンは、白丸のかわりに件数を出す */
.pin.multi::after{display:none}
.pin .n{position:absolute;left:0;top:0;width:100%;height:100%;
  transform:rotate(45deg);display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:12px;font-weight:800}
.leaflet-marker-icon:hover .pin{transform:rotate(-45deg) scale(1.18)}
/* お気に入りはピンクのハート。物件詳細ページのお気に入りボタンと同じ色・同じ記号。
   ⚠️ オレンジにしないこと。OSMの地図は主要道路がオレンジで、ピンが道に埋もれる。
   ⚠️ ピンクは通常の赤と色相が近く、色だけでは見分けられない。
     ひと回り大きくして白フチを太くし、色以外でも差がつくようにしている。 */
.pin.fav{width:34px;height:34px;margin:-17px 0 0 -17px;background:#E0397B;border-width:4px;
  box-shadow:0 3px 10px rgba(0,0,0,.5)}
.pin.fav::after{content:"♥";width:auto;height:auto;margin:0;background:none;border-radius:0;
  transform:translate(-50%,-50%) rotate(45deg);color:#fff;font-size:17px;line-height:1}
/* ふきだし。LINEで送っているカードと同じ見た目・同じ項目にする。 */
.pop{width:264px}
/* 画像は最大4枚。LINEと同じく、1枚目を大きく、残りを右に並べる */
.imgs{display:flex;gap:3px;margin-bottom:8px}
.imgs .main{flex:1 1 auto;min-width:0}
.imgs .main img{width:100%;height:132px;object-fit:contain;background:#f2f3f5;border-radius:6px;display:block}
.imgs .side{display:flex;flex-direction:column;gap:3px;flex:0 0 62px}
.imgs .side img{width:62px;height:42px;object-fit:cover;background:#f2f3f5;border-radius:6px;display:block}
.pop .nm{font-size:14px;font-weight:700;color:#1a2538;line-height:1.4;margin-bottom:2px}
/* 物件ページのお気に入りボタンと同じ配色にする */
.pop .fav-badge{display:inline-block;background:#E0397B;color:#fff;font-size:10px;font-weight:700;
  border-radius:6px;padding:3px 8px;margin-bottom:5px}
.pop .rent{font-size:19px;font-weight:800;color:#E5533D;line-height:1.2}
.pop .rent small{font-size:11px;font-weight:600;color:#888;margin-left:2px}
.pop .money{font-size:11px;color:#666;line-height:1.6;margin-top:2px}
.pop .tags{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.pop .tag{background:#eef3e6;color:#4b7d0f;font-size:11px;font-weight:700;border-radius:4px;padding:2px 7px}
.pop .addr{font-size:11px;color:#555;line-height:1.6;margin-top:4px}
.pop .sta{font-size:11px;color:#555;line-height:1.6}
.pop .sta .other{color:#999}
.pop .memo{background:#fdf6e3;border-radius:6px;padding:7px 8px;margin-top:7px;font-size:11px;color:#6b5a1e;line-height:1.6}
.pop .memo b{display:block;font-size:10px;color:#a08b3a;margin-bottom:2px}
.pop a.btn{display:block;margin-top:9px;background:#6ea814;color:#fff;text-align:center;padding:9px 0;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none}
/* 同じ建物に複数のお部屋があるとき */
.pop .cnt{font-size:11px;color:#888;margin-bottom:6px}
.pop .rooms{max-height:300px;overflow-y:auto;margin:0 -2px}
.pop .room{border-top:1px solid #eee;padding:9px 2px}
.pop .room:first-child{border-top:none}
.leaflet-popup-content{margin:10px}
/* ── スマホ ──
   ふきだしは画面が狭いと収まりきらず、上下が見切れる。
   狭い画面では、ピンを押したら画面下から出るシートに切り替える。 */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1200;background:#fff;
  border-radius:16px 16px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.28);
  max-height:72vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 14px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .18s ease-out}
.sheet.open{transform:translateY(0)}
/* 画像の上に重なっても見えるよう、白い丸にする */
.sheet-x{position:absolute;right:10px;top:10px;width:34px;height:34px;border:none;
  background:rgba(255,255,255,.94);border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,.28);
  font-size:20px;line-height:34px;padding:0;color:#555;cursor:pointer;z-index:2}
.sheet .pop{width:auto}
.sheet .imgs .main img{height:180px}
.sheet .imgs .side{flex:0 0 76px}
.sheet .imgs .side img{width:76px;height:58px}
.sheet .rooms{max-height:none;overflow:visible}
@media (max-width: 520px) {
  header h1{font-size:15px}
  /* 小さい字はスマホだと読めないので底上げする */
  .pop .money, .pop .addr, .pop .sta, .pop .memo, .pop .cnt{font-size:12px}
  .pop .tag{font-size:12px}
  .pop .nm{font-size:15px}
  .pop .rent{font-size:21px}
  .pop a.btn{padding:12px 0;font-size:14px}
}
/* 下向きに出したふきだしは、下を指す三角を消す（指す先が無いため） */
.leaflet-popup.below .leaflet-popup-tip-container{display:none}
.note{flex:none;background:#fff;border-top:1px solid #eee;padding:9px 16px;font-size:11px;color:#999;text-align:center}
/* ── 一覧 ──
   地図だけだと「あの物件どれだっけ」が探せない。左に一覧を並べ、
   押したらその場所へ飛ぶようにする。絞り込みは建物名・住所・駅にかかる。 */
/* 一覧は地図に重ねる。畳むときに地図の大きさを変えると、見ていた場所が
   ずれて気持ち悪いため。地図はいつも全幅のままで、一覧が上に乗る。 */
.main{flex:1;display:flex;min-height:0;position:relative}
:root{--lw:320px}
#list{position:absolute;left:0;top:0;bottom:0;width:var(--lw);z-index:1000;
  background:#fff;border-right:1px solid #eee;box-shadow:2px 0 10px rgba(0,0,0,.07);
  display:flex;flex-direction:column;transition:transform .22s ease}
.list-head{flex:none;padding:10px;border-bottom:1px solid #f0f0f0;position:relative}
.list-head input{width:100%;border:1px solid #e2e5ea;border-radius:8px;padding:8px 10px;
  font-size:13px;font-family:inherit;outline:none;-webkit-appearance:none}
.list-head input:focus{border-color:#6ea814}
.list-cnt{font-size:11px;color:#999;margin-top:6px}
.rows{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:9px;align-items:flex-start;padding:10px;
  border-bottom:1px solid #f4f4f4;cursor:pointer}
.row:hover{background:#f7faf2}
.row.on{background:#eef3e6}
/* 間取り図は切ると読めなくなるので、切り抜かず全体を収める（ふきだしの画像と同じ） */
.row .th{width:62px;height:46px;flex:none;object-fit:contain;background:#f2f3f5;border-radius:6px}
.row .ri{flex:1;min-width:0}
.row .rn{font-size:12px;font-weight:700;color:#1a2538;line-height:1.4}
.row .rr{font-size:13px;font-weight:800;color:#E5533D;margin-top:2px}
.row .rr span{font-size:11px;font-weight:600;color:#888;margin-left:4px}
.row .rs{font-size:11px;color:#888;line-height:1.5;margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rfav{flex:none;color:#E0397B;font-size:14px;line-height:1.2}
.list-empty{padding:22px 12px;font-size:12px;color:#999;text-align:center;line-height:1.7}
/* 一覧で選んでいる場所のピンは、地図の中でも目立たせる */
.pin.hl{transform:rotate(-45deg) scale(1.25)}
/* ヘッダーのボタン。スマホで一覧を全面に出すのに使う（PCはでっぱりで開け閉め） */
.list-btn{flex:none;display:none;border:1px solid #dfe3e8;background:#fff;border-radius:8px;
  padding:7px 12px;font-size:13px;font-weight:700;color:#33691e;font-family:inherit;cursor:pointer}
.list-btn:hover{background:#f7faf2}
/* PCで一覧を畳んだ状態。地図は動かさず、一覧だけ左へ逃がす。 */
#list.off{transform:translateX(-100%)}
/* 一覧の右肩にあるでっぱり。押すと開け閉めできる。
   一覧といっしょに動くので、畳むと画面の左端に残る。 */
.list-handle{position:absolute;right:-22px;top:50%;margin-top:-33px;width:22px;height:66px;
  border:1px solid #e2e5ea;border-left:none;border-radius:0 10px 10px 0;background:#fff;
  box-shadow:2px 1px 6px rgba(0,0,0,.12);padding:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:#5b6470;font-size:13px}
.list-handle:hover{background:#f7faf2;color:#33691e}
/* 地図の拡大縮小ボタンは一覧の下に隠れるので、開いている間はよける */
#list ~ #map .leaflet-top.leaflet-left{margin-left:var(--lw);transition:margin-left .22s ease}
#list.off ~ #map .leaflet-top.leaflet-left{margin-left:0}
.list-x{display:none;position:absolute;right:8px;top:8px;width:34px;height:34px;border:none;
  background:#f2f3f5;border-radius:50%;font-size:20px;line-height:34px;padding:0;color:#555;cursor:pointer}
@media (max-width: 760px) {
  :root{--lw:264px}
}
@media (max-width: 520px) {
  .list-btn{display:block}
  .list-handle{display:none}
  /* スマホは下から出す。詳細シートと同じ動き方に揃える。
     display の切り替えだと動きが出ないので、隠すときは画面の下へ逃がす。 */
  #list{position:fixed;left:0;right:0;top:0;bottom:0;width:auto;z-index:1300;
    border-right:none;box-shadow:none;display:flex;transform:translateY(100%);visibility:hidden;
    transition:transform .2s ease-out, visibility 0s linear .2s}
  /* スマホでは畳んだ状態(off)は使わない。全面に出すかどうかだけ。 */
  #list.open{transform:translateY(0);visibility:visible;transition:transform .2s ease-out}
  #list ~ #map .leaflet-top.leaflet-left{margin-left:0}
  .list-head{padding:12px 52px 12px 12px}
  .list-x{display:block}
  .row .th{width:76px;height:57px}
  .row .rn{font-size:13px}
  .row .rr{font-size:14px}
  .row .rs{font-size:12px}
}
</style>
</head>
<body>
<header style="display:flex;align-items:center;gap:10px">
  <div style="flex:1;min-width:0">
    <h1 id="title">お部屋マップ</h1>
    <div class="sub" id="sub">読み込んでいます…</div>
  </div>
  <button class="list-btn" id="listBtn" style="display:none">◀ 一覧</button>
</header>
<div class="state" id="state"><div class="spinner"></div><p>お部屋を探しています…</p></div>
<div class="main" id="main" style="display:none">
  <aside id="list">
    <div class="list-head">
      <input id="q" type="search" placeholder="建物名・住所・駅でしぼる" autocomplete="off">
      <div class="list-cnt" id="listCnt"></div>
      <button class="list-x" id="listClose" aria-label="閉じる">×</button>
    </div>
    <div class="rows" id="rows"></div>
    <button class="list-handle" id="listHandle" aria-label="一覧の開け閉め">◀</button>
  </aside>
  <div id="map"></div>
</div>
<div class="sheet" id="sheet" style="display:none">
  <button class="sheet-x" id="sheetClose" aria-label="閉じる">×</button>
  <div id="sheetBody"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyCqgB4lhAN0mGSi6acYl7bSWRg-TVHr9b_-I5vCsWYaOA5ceIfWh-5cqpGBLIFrHu7/exec';
var EDGE_MAP_BASE = 'https://ehomaki-img.delicate-bush-f5a9.workers.dev/m/';

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
// 賃料は「10.9万円」の形。四捨五入せず、そのままの値を万円に直して出す。
function yen(v) {
  var n = Number(v);
  if (!isFinite(n) || n <= 0) return '';
  var man = n / 10000;
  return (String(man).indexOf('.') >= 0 ? man : man) + '万円';
}
function showState(html) {
  var el = document.getElementById('state');
  el.style.display = 'flex';
  el.innerHTML = html;
  document.getElementById('main').style.display = 'none';
}

var token = new URLSearchParams(window.location.search).get('t') || '';
if (!token) {
  document.getElementById('sub').textContent = '';
  showState('<h2>リンクが正しくありません</h2><p>担当者からお送りしたリンクを、もう一度お開きください。</p>');
} else {
  // まずエッジ（Cloudflare）から読む。GASのWebアプリは一番軽い応答でも3秒かかり、
  // 待たせすぎるため。エッジは実測0.2秒。
  // まだ作られていない顧客のときだけ、GASに聞きに行く（遅いが必ず出る）。
  fetch(EDGE_MAP_BASE + encodeURIComponent(token))
    .then(function (r) {
      if (!r.ok) throw new Error('not_built');
      return r.json();
    })
    .then(render)
    .catch(function () {
      return fetch(GAS_API_URL + '?action=customer_map&t=' + encodeURIComponent(token), { redirect: 'follow' })
        .then(function (r) { return r.json(); })
        .then(render);
    })
    .catch(function () {
      document.getElementById('sub').textContent = '';
      showState('<h2>読み込めませんでした</h2><p>通信の状態を確かめて、もう一度お開きください。</p>');
    });
}

// 画面が狭いか（スマホか）。狭いときはふきだしではなく、下から出るシートにする。
var isNarrow = window.matchMedia('(max-width: 520px)').matches;

function openSheet(html) {
  var sheet = document.getElementById('sheet');
  document.getElementById('sheetBody').innerHTML = html;
  sheet.style.display = 'block';
  // display を変えた直後だと動きが出ないので、1フレーム置いてから開く。
  // 裏のタブでは requestAnimationFrame が来ないので、時間でも開くようにする。
  requestAnimationFrame(function () { sheet.classList.add('open'); });
  setTimeout(function () { sheet.classList.add('open'); }, 60);
}
function closeSheet() {
  var sheet = document.getElementById('sheet');
  if (!sheet.classList.contains('open')) return;
  sheet.classList.remove('open');
  setTimeout(function () { sheet.style.display = 'none'; }, 200);
}
document.getElementById('sheetClose').addEventListener('click', closeSheet);

// お客様が地図を開いたことを知らせる。画面には何も出さず、投げっぱなしにする。
// 物件ページ(property.html)の閲覧トラッキングと同じやり方。
// 担当者モードのブラウザからは送らない（サーバー側でもIPで弾いている）。
var _mapViewSent = false;
function trackMapView() {
  if (_mapViewSent || !token) return;
  try { if (localStorage.getItem('admin_mode') === '1') return; } catch (e) {}
  _mapViewSent = true;
  var ua = navigator.userAgent || '';
  var base = GAS_API_URL + '?action=map_view&t=' + encodeURIComponent(token)
    + '&ua=' + encodeURIComponent(ua)
    + '&line=' + (/Line\//.test(ua) ? '1' : '0');
  var sent = false;
  function send(extra) {
    if (sent) return;
    sent = true;
    try { fetch(base + extra, { redirect: 'follow' }).catch(function () {}); } catch (e) {}
  }
  // 場所が引けないこともあるので、3秒で待つのをやめて送る
  setTimeout(function () { send(''); }, 3000);
  try {
    fetch('https://ipapi.co/json/')
      .then(function (r) { return r.json(); })
      .then(function (geo) {
        send('&ip=' + encodeURIComponent(geo.ip || '')
          + '&country=' + encodeURIComponent(geo.country_name || '')
          + '&region=' + encodeURIComponent(geo.region || '')
          + '&city=' + encodeURIComponent(geo.city || '')
          + '&isp=' + encodeURIComponent(geo.org || ''));
      })
      .catch(function () { send(''); });
  } catch (e) { send(''); }
}

// LINEで送っているカードと同じ形。地図のふきだしにもこれを出す。
function cardHtml(p, compact) {
  var h = '';
  var imgs = p.images && p.images.length ? p.images : (p.image ? [p.image] : []);
  if (imgs.length) {
    h += '<div class="imgs"><div class="main"><img src="' + esc(imgs[0]) + '" alt="" loading="lazy"></div>';
    if (imgs.length > 1) {
      h += '<div class="side">';
      for (var i = 1; i < imgs.length && i < 4; i++) {
        h += '<img src="' + esc(imgs[i]) + '" alt="" loading="lazy">';
      }
      h += '</div>';
    }
    h += '</div>';
  }
  if (p.favorite) h += '<div class="fav-badge">♥ お気に入り</div>';
  h += '<div class="nm">' + esc(compact ? (p.room || p.name) : p.name) + '</div>';
  var rent = yen(p.rent);
  if (rent) h += '<div class="rent">' + rent + '<small>/月</small></div>';
  var money = [];
  money.push('管理費 ' + (p.managementFee ? Number(p.managementFee).toLocaleString() + '円' : 'ー'));
  h += '<div class="money">' + money.join('') + '</div>';
  h += '<div class="money">敷金 ' + esc(p.deposit || 'ー') + ' / 礼金 ' + esc(p.keyMoney || 'ー') + '</div>';
  var tags = [];
  if (p.layout) tags.push(esc(p.layout));
  if (p.area) tags.push(esc(p.area) + 'm²');
  if (p.buildingAge) tags.push(esc(p.buildingAge));
  if (p.floorText) tags.push(esc(p.floorText));
  if (tags.length) {
    h += '<div class="tags">';
    for (var t = 0; t < tags.length; t++) h += '<span class="tag">' + tags[t] + '</span>';
    h += '</div>';
  }
  if (p.address) h += '<div class="addr">' + esc(p.address) + '</div>';
  if (p.station) h += '<div class="sta">' + esc(p.station) + '</div>';
  var others = p.otherStations || [];
  if (others.length) {
    h += '<div class="sta other">その他の路線</div>';
    for (var o = 0; o < others.length; o++) {
      h += '<div class="sta">' + esc(others[o]) + '</div>';
    }
  }
  if (p.staffComment) {
    h += '<div class="memo"><b>担当者より</b>' + esc(p.staffComment) + '</div>';
  }
  h += '<a class="btn" href="' + esc(p.url) + '" target="_blank" rel="noopener">物件詳細を見る</a>';
  return h;
}

function render(d) {
  if (!d || !d.ok) {
    document.getElementById('sub').textContent = '';
    showState('<h2>リンクが正しくありません</h2><p>' + esc((d && d.error) || '') + '</p>');
    return;
  }
  trackMapView();
  // 見出しはお客様が読む言葉にする。「◯◯様にお送りした」は送り手の言い方なので使わない。
  // 名前の出し方は物件ページ(property.html)の「◯◯ 様専用ページ」に揃える。
  var who = String(d.customer || '').trim();
  document.getElementById('title').textContent = 'お部屋マップ';
  var props = d.properties || [];
  if (props.length === 0) {
    document.getElementById('sub').textContent = who ? who + ' 様専用ページ' : '';
    showState('<h2>ご紹介したお部屋はまだございません</h2><p>お部屋が見つかりましたら、LINEでお知らせいたします。</p>');
    return;
  }
  document.getElementById('sub').textContent =
    (who ? who + ' 様専用ページ ／ ' : '') + props.length + '件';
  document.getElementById('state').style.display = 'none';
  document.getElementById('main').style.display = 'flex';
  if (isNarrow) document.getElementById('listBtn').style.display = 'block';

  var map = L.map('map', { scrollWheelZoom: true });
  // 前に畳んだままにしていたら、その状態で開く
  if (!isNarrow) setListOff(readListOff(), true);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  // 同じ建物の別のお部屋は座標が同じで、ピンが完全に重なって見えなくなる。
  // 場所ごとにまとめて1つのピンにし、ふきだしにお部屋を並べる。
  var groups = {};
  var order = [];
  props.forEach(function (p) {
    var key = Number(p.lat).toFixed(6) + ',' + Number(p.lng).toFixed(6);
    if (!groups[key]) { groups[key] = []; order.push(key); }
    groups[key].push(p);
  });

  var bounds = [];
  var markers = {};   // 場所キー → ピン。一覧から押されたときに開く
  var popups = {};    // 場所キー → ふきだしのHTML（スマホのシート用）
  order.forEach(function (key) {
    var list = groups[key];
    var head = list[0];
    var many = list.length > 1;
    // まとまっているピンは、1つでもお気に入りがあれば色を変える
    var anyFav = list.some(function (x) { return x.favorite; });
    var icon = L.divIcon({
      className: '',
      html: '<div class="pin' + (many ? ' multi' : '') + (anyFav ? ' fav' : '') + '">'
        + (many ? '<span class="n">' + list.length + '</span>' : '') + '</div>',
      // スマホは指で押すので当たり判定を広めに取る
      iconSize: isNarrow ? [44, 44] : [32, 32],
      iconAnchor: isNarrow ? [22, 36] : [16, 30],   // しずくの先端が場所を指すように
      popupAnchor: [0, -30]
    });
    var m = L.marker([head.lat, head.lng], { icon: icon }).addTo(map);
    markers[key] = m;

    var html = '<div class="pop">';
    if (many) {
      // 同じ建物に複数のお部屋。建物名を見出しにして、お部屋を並べる。
      html += '<div class="nm">' + esc(head.building || head.name) + '</div>';
      html += '<div class="cnt">この建物のお部屋 ' + list.length + '件</div>';
      html += '<div class="rooms">';
      list.forEach(function (p) {
        html += '<div class="room">' + cardHtml(p, true) + '</div>';
      });
      html += '</div>';
    } else {
      html += cardHtml(head, false);
    }
    html += '</div>';

    popups[key] = html;

    if (isNarrow) {
      // スマホ。押したら下からシートを出す。ふきだしは画面に収まらないので使わない。
      m.on('click', function () { openSheet(html); });
      bounds.push([head.lat, head.lng]);
      return;
    }

    // autoPan を切る。上の方のピンを見るたびに地図が勝手に動いてしまうため。
    m.bindPopup(html, { autoPan: false });

    // 重ねると出て、離すと消す。
    // ただしふきだしの上にカーソルが移った時は消さない（中を読めなくなるため）。
    // 一覧から飛んでいる最中は開かない。地図が動くと、止まっているカーソルの下を
    // 関係ないピンが通り過ぎ、そのふきだしが勝手に開いてしまうため。
    m.on('mouseover', function () { if (map._flying) return; this.openPopup(); });
    m.on('mouseout', function () {
      var self = this;
      setTimeout(function () {
        var el = self.getPopup() && self.getPopup().getElement();
        if (el && el.matches(':hover')) return;   // ふきだしの上にいる
        self.closePopup();
      }, 120);
    });
    m.on('popupopen', function () {
      var self = this;
      var el = this.getPopup().getElement();
      if (!el) return;

      // ふきだしはピンの下に出す。
      // 上に出すと、上の方のピンでは画面から出てしまい、Leafletが地図を
      // 動かして見ている場所がずれる。下に出せば動かさずに収まる。
      // ただし下にも収まらないときだけ、従来どおり上に出す。
      el.classList.remove('below');
      el.style.marginBottom = '';
      var h = el.offsetHeight;
      var pt = map.latLngToContainerPoint(self.getLatLng());
      if (pt.y + h + 50 < map.getSize().y) {
        el.style.marginBottom = (-h - 44) + 'px';
        el.classList.add('below');
      }

      if (el._hoverBound) return;
      el._hoverBound = true;
      el.addEventListener('mouseleave', function () { self.closePopup(); });
    });

    bounds.push([head.lat, head.lng]);
  });
  if (isNarrow) map.on('click', closeSheet);
  map.fitBounds(bounds, {
    paddingTopLeft: [listWidthPx() + 40, 40],
    paddingBottomRight: [40, 40],
    maxZoom: 16
  });

  buildList(props, markers, popups, map);
}

// ── 一覧 ──
// 地図の上でお部屋を1つずつ探すのは大変なので、横に並べて押せるようにする。
function buildList(props, markers, popups, map) {
  var rowsEl = document.getElementById('rows');
  var cntEl = document.getElementById('listCnt');
  var qEl = document.getElementById('q');

  // 一覧の並びは地図と同じ場所キーでひもづける（ピンのまとめ方と合わせる）
  var items = props.map(function (p, i) {
    var key = Number(p.lat).toFixed(6) + ',' + Number(p.lng).toFixed(6);
    var imgs = p.images && p.images.length ? p.images : (p.image ? [p.image] : []);
    var find = [p.name, p.building, p.room, p.address, p.station, p.layout]
      .concat(p.otherStations || []).join(' ').toLowerCase();
    return { i: i, p: p, key: key, img: imgs[0] || '', find: find };
  });

  function rowHtml(it) {
    var p = it.p;
    var h = '<div class="row" data-i="' + it.i + '">';
    h += it.img
      ? '<img class="th" src="' + esc(it.img) + '" alt="" loading="lazy">'
      : '<div class="th"></div>';
    h += '<div class="ri"><div class="rn">' + esc(p.name) + '</div>';
    var rent = yen(p.rent);
    var meta = [];
    if (p.layout) meta.push(esc(p.layout));
    if (p.area) meta.push(esc(p.area) + 'm²');
    h += '<div class="rr">' + (rent || 'ー')
      + (meta.length ? '<span>' + meta.join(' / ') + '</span>' : '') + '</div>';
    if (p.station) h += '<div class="rs">' + esc(p.station) + '</div>';
    h += '</div>';
    if (p.favorite) h += '<span class="rfav">♥</span>';
    h += '</div>';
    return h;
  }

  function draw(list) {
    cntEl.textContent = list.length + '件';
    rowsEl.innerHTML = list.length
      ? list.map(rowHtml).join('')
      : '<div class="list-empty">見つかりませんでした。<br>別のことばでお試しください。</div>';
  }
  draw(items);

  qEl.addEventListener('input', function () {
    var q = qEl.value.trim().toLowerCase();
    draw(q ? items.filter(function (it) { return it.find.indexOf(q) >= 0; }) : items);
  });

  // ピンを一時的に大きくして、どれのことか分かるようにする
  function hl(key, on) {
    var m = markers[key];
    var el = m && m.getElement() && m.getElement().querySelector('.pin');
    if (el) el.classList.toggle('hl', !!on);
  }

  rowsEl.addEventListener('click', function (ev) {
    var row = ev.target.closest ? ev.target.closest('.row') : null;
    if (!row) return;
    var it = items[Number(row.getAttribute('data-i'))];
    if (!it) return;
    var m = markers[it.key];
    if (!m) return;

    var was = rowsEl.querySelector('.row.on');
    if (was) was.classList.remove('on');
    row.classList.add('on');

    // 押した物件が今の画面に写っているかどうかで動きを変える。
    // 写っているなら縮尺はそのまま（勝手に寄られると位置関係を見失う）。
    // 一覧の下に隠れているものは「写っていない」とみなす。
    var ll = m.getLatLng();
    var pt = map.latLngToContainerPoint(ll);
    var size = map.getSize();
    var lw = listWidthPx();
    var inView = pt.x > lw + 30 && pt.x < size.x - 30 && pt.y > 30 && pt.y < size.y - 30;
    var zoom = Math.max(map.getZoom(), 15);

    // スマホは一覧が全画面なので、地図が動いているところは見えない。
    // 動き終わるのを待つと押してから開くまで待たされるだけなので、一瞬で移す。
    if (isNarrow) {
      closeList();
      if (!inView) map.setView(ll, zoom, { animate: false });
      openSheet(popups[it.key]);
      return;
    }

    if (inView) {
      m.openPopup();
      return;
    }

    // PCは地図が見えているので、瞬間移動せず滑らかに飛ぶ。どこへ動いたか目で追える。
    // 飛び終わってから開く。ただし裏のタブなどで moveend が来ないことがあるので、
    // 時間でも必ず開くようにしておく（開かないと押しても無反応に見える）。
    var opened = false;
    var once = function () {
      if (opened) return;
      opened = true;
      map._flying = false;
      m.openPopup();
    };
    map._flying = true;
    map.closePopup();
    map.once('moveend', once);
    setTimeout(once, 1100);
    map.flyTo(centerBesideList(map, ll, zoom), zoom, { duration: 0.9 });
  });

  // マウスを乗せているあいだ、その場所のピンを目立たせる
  rowsEl.addEventListener('mouseover', function (ev) {
    var row = ev.target.closest ? ev.target.closest('.row') : null;
    if (!row) return;
    var it = items[Number(row.getAttribute('data-i'))];
    if (it) hl(it.key, true);
  });
  rowsEl.addEventListener('mouseout', function (ev) {
    var row = ev.target.closest ? ev.target.closest('.row') : null;
    if (!row) return;
    var it = items[Number(row.getAttribute('data-i'))];
    if (it) hl(it.key, false);
  });
}

function openList() { document.getElementById('list').classList.add('open'); }
function closeList() { document.getElementById('list').classList.remove('open'); }

// ── PCでの一覧の開け閉め ──
// 地図を広く見たいときに畳める。閉じたままにしたい人もいるので、次に開いたときも覚えておく。
// 一覧は地図に重なっているだけなので、開け閉めしても地図は動かない。

// 一覧が今ふさいでいる横幅。地図を寄せるときに、この分だけ右へずらすのに使う。
function listWidthPx() {
  var el = document.getElementById('list');
  if (isNarrow || !el || el.classList.contains('off')) return 0;
  return el.getBoundingClientRect().width;
}
// 一覧に隠れないよう、見えている側の真ん中に来るような地図の中心を返す
function centerBesideList(map, ll, zoom) {
  var w = listWidthPx();
  if (!w) return ll;
  return map.unproject(map.project(ll, zoom).subtract([w / 2, 0]), zoom);
}

function readListOff() {
  try { return localStorage.getItem('mapListOff') === '1'; } catch (e) { return false; }
}
function setListOff(off, instant) {
  var el = document.getElementById('list');
  // 開いた瞬間に前回の状態を戻すときは、畳む動きを見せない
  if (instant) {
    el.style.transition = 'none';
    setTimeout(function () { el.style.transition = ''; }, 0);
  }
  el.classList.toggle('off', !!off);
  document.getElementById('listHandle').textContent = off ? '▶' : '◀';
  try { localStorage.setItem('mapListOff', off ? '1' : '0'); } catch (e) {}
}
document.getElementById('listHandle').addEventListener('click', function () {
  setListOff(!document.getElementById('list').classList.contains('off'));
});
document.getElementById('listBtn').addEventListener('click', openList);
document.getElementById('listClose').addEventListener('click', closeList);
</script>
</body>
