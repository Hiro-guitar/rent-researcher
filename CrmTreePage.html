<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --bg: #f4f5f3; --surface: #fff; --ink: #1c211f; --muted: #6d7772; --hair: #dde2df;
    --red: #c2362b; --line: #b9c2bd; --red-soft: #fbeceb; --green: #1f6b5c; --green-soft: #e4efeb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141816; --surface: #1c2220; --ink: #e6ebe8; --muted: #8e9994; --hair: #2e3834;
      --red: #ef7d72; --line: #46524d; --red-soft: #3a2220; --green: #5cc0a9; --green-soft: #1d2f2a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px 60px; }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; flex: 1; }
  .btn { border: 1px solid var(--hair); background: var(--surface); color: var(--ink);
    border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; text-decoration: none; }
  .today { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; }
  .today b { font-size: 22px; color: var(--red); }
  .today.zero b { color: var(--green); }
  .urgent { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .tree { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px;
    padding: 12px 14px 16px; overflow-x: auto; }
  .tree ul { list-style: none; margin: 0; padding: 0 0 0 22px; }
  .tree > ul { padding-left: 0; }
  .tree li { position: relative; padding: 8px 0 0 20px; }
  .tree > ul > li { padding-left: 0; }
  .tree li::before { content: ''; position: absolute; left: 0; top: 0; height: 100%;
    border-left: 2px solid var(--line); }
  .tree li:last-child::before { height: 27px; }
  .tree li::after { content: ''; position: absolute; left: 0; top: 27px; width: 20px;
    border-top: 2px solid var(--line); }
  .tree > ul > li::before, .tree > ul > li::after { display: none; }
  .tree .gap { height: 14px; }
  .box { display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 6px 12px;
    border: 1.5px solid var(--hair); border-radius: 8px; background: var(--surface);
    cursor: pointer; white-space: nowrap; font-size: 14px; }
  .box.zero { color: var(--muted); cursor: default; }
  .box.mine.has { border-color: var(--red); background: var(--red-soft); font-weight: 700; }
  .box.sel { outline: 3px solid var(--green); outline-offset: 1px; }
  .box .count { min-width: 24px; text-align: center; border-radius: 12px; padding: 0 7px; font-size: 13px;
    background: var(--bg); color: var(--muted); font-weight: 400; }
  .box.has .count { color: var(--ink); }
  .box.mine.has .count { background: var(--red); color: #fff; font-weight: 700; }
  .box .sub { color: var(--muted); font-size: 12px; font-weight: 400; }
  .panel { margin-top: 14px; }
  .panel h2 { font-size: 16px; margin: 0 0 4px; }
  .cust { border: 1px solid var(--hair); border-radius: 8px; padding: 10px 12px; margin-top: 8px; }
  .cust .name { font-weight: 700; }
  .cust .name a { color: inherit; }
  .cust .meta { color: var(--muted); font-size: 13px; }
  .cust .note { color: var(--red); font-size: 13px; }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .acts .btn { padding: 6px 10px; }
  .acts.small .btn { font-size: 12px; padding: 4px 8px; color: var(--muted); }
  .menu { flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .search { width: 100%; padding: 10px 12px; margin-bottom: 12px; border: 1px solid var(--hair);
    border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 15px; }
  .where { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .auto { margin-top: 4px; font-size: 12px; color: var(--green); }
  .wrap { max-width: 1560px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px 400px; gap: 14px; align-items: start; }
  @media (max-width: 1280px) { .layout { grid-template-columns: minmax(0, 1fr) 360px; } .layout .props { grid-column: 2; } }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } .layout .props { grid-column: auto; } }
  .layout .panel { max-height: calc(100vh - 16px); overflow-y: auto; }
  @media (max-width: 860px) { .layout .panel { max-height: none; position: static; } }
  .panel { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 12px 14px; margin-top: 0;
    position: sticky; top: 8px; }
  .tree li::after { top: 22px; }
  .tree li:last-child::before { height: 22px; }
  .stage { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .stage .label { font-weight: 700; font-size: 13px; padding: 4px 10px; border: 1.5px solid var(--hair); border-radius: 6px; background: var(--surface); white-space: nowrap; }
  .stage .label.grp { border-color: var(--green); color: var(--green); }
  .stage .label .n { font-weight: 400; color: var(--muted); margin-left: 2px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 13px;
    border: 1px solid var(--hair); background: var(--bg); cursor: pointer; white-space: nowrap; }
  .chip .st { font-size: 11px; color: var(--muted); }
  .chip.todo { border-color: var(--red); background: var(--red-soft); }
  .chip.todo .nm { color: var(--red); font-weight: 700; }
  .chip.done { opacity: .6; }
  .chip.sel { outline: 3px solid var(--green); outline-offset: 1px; opacity: 1; }
  .chip .flag { font-size: 11px; color: #9a5b12; background: #fbf0df; padding: 0 6px; border-radius: 4px; }
  .stage .label.fold { cursor: pointer; }
  .more { font-size: 12px; color: var(--muted); background: none; border: 1px dashed var(--hair); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  .hits { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .abc { display: flex; gap: 6px; margin: 8px 0 2px; }
  .abc button { flex: 1; padding: 6px 0; border-radius: 6px; border: 1.5px solid var(--hair); background: var(--surface); color: var(--ink); font-weight: 700; cursor: pointer; }
  .abc button.on { border-color: var(--green); background: var(--green-soft); color: var(--green); }
  .sec { margin-top: 12px; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
  .inq { font-size: 13px; margin-top: 4px; }
  .inq a { color: var(--green); font-weight: 700; }
  .crit { display: flex; flex-direction: column; gap: 4px; }
  .prop { display: grid; grid-template-columns: 22px 72px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--hair); }
  .prop.on { background: var(--green-soft); }
  .prop img, .prop .noimg { width: 72px; height: 54px; object-fit: contain; border-radius: 4px; background: #fff; cursor: zoom-in; }   /* 間取り図が見切れないよう全体を出す */
  .prop .pt { font-weight: 700; font-size: 13px; }
  .prop .warn { font-size: 12px; color: #b3541e; }
  .prop .cmt { font-size: 12px; margin-top: 2px; }
  .prop.sent, .prop.nopick { grid-template-columns: 72px 1fr; }
  .prop .pl { font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 2px; align-items: center; }
  .prop .pl label { display: inline-flex; gap: 3px; align-items: center; }
  .prop .cmt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ptabs { display: flex; gap: 4px; position: sticky; top: -12px; background: var(--surface); padding: 4px 0 6px; z-index: 2; border-bottom: 1px solid var(--hair); }
  .ptab { flex: 1; padding: 6px 2px; border: 1px solid var(--hair); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .ptab b { font-weight: 700; }
  .ptab.on { border-color: var(--green); background: var(--green-soft); color: var(--green); }
  .sendbox { position: sticky; bottom: -12px; background: var(--surface); border-top: 1px solid var(--hair); padding: 8px 0 12px; margin-top: 8px; z-index: 2; }
  .memo.small { min-height: 64px; }
  .tasks { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  /* やること: 上の段＝日付と内容（幅いっぱい）、下の段＝誰の番か・済み・日付・消す（列が狭くても潰れないように） */
  .task { display: flex; flex-direction: column; gap: 3px; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--hair); }
  .task .ttop { display: flex; gap: 8px; align-items: baseline; }
  .task .tdate { flex: 0 0 auto; white-space: nowrap; }
  .task .tbody { flex: 1; min-width: 0; word-break: break-word; }
  .task.due .tdate, .task.due .tbody { color: var(--red); font-weight: 700; }
  .task .tdate { font-size: 12px; color: var(--muted); }
  .task .twait { font-size: 11px; color: var(--muted); border: 1px solid var(--hair); border-radius: 4px; padding: 0 4px; }
  .task.wait:not(.due) .tbody { color: var(--muted); }
  .task .tbtns { display: flex; gap: 10px; font-size: 12px; align-items: center; flex-wrap: wrap; }
  .task .tbtns select { padding: 2px 4px; }
  .task .tbtns a { color: var(--green); }
  .task .tbtns a.skip { color: var(--muted); }
  .tadd { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
  .tadd .inp { flex: 1 1 100%; }
  .tdin { padding: 4px 6px; border: 1px solid var(--hair); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; font-size: 12px; }
  .ttasks:empty { display: none; }
  .ttasks { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 8px 14px; margin-top: 8px; }
  .tthead { font-size: 14px; cursor: pointer; }
  .tthead b { color: var(--red); }
  .ttrow { font-size: 13px; padding: 4px 0; border-top: 1px solid var(--hair); cursor: pointer; }
  .ttrow:hover { background: var(--bg); }
  .ttrow b { margin-right: 6px; }
  .prop .pl a.candbtn { font-weight: 700; }
  .watch { border: 1px solid var(--hair); border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
  .watch.open { border-color: var(--red); background: var(--red-soft); }
  /* リンクは既定の青・紫だと暗い背景で読めないので、ページ全体で緑にそろえる */
  .panel a, .watch a { color: var(--green); }
  .panel a:visited { color: var(--green); }
  .watch .pt { font-weight: 700; }
  .endtag { font-size: 11px; font-weight: 400; color: var(--red); border: 1px solid var(--red); border-radius: 4px; padding: 0 5px; }
  .watch .pl { font-size: 12px; display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
  .watch .pl a.skip { color: var(--muted); }
  .watch .tag { font-size: 11px; font-weight: 400; color: var(--muted); border: 1px solid var(--hair); border-radius: 4px; padding: 0 5px; margin-left: 4px; }
  .prop .pl { font-size: 12px; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
  .prop .pl a { color: var(--green); }
  .prop .pl a.skip { color: var(--muted); }
  .prop .imgs { grid-column: 1 / -1; display: flex; gap: 4px; overflow-x: auto; }
  .prop .imgs img { width: 140px; height: 105px; }
  .crit .fl { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .crit .inp { width: 100%; padding: 6px 8px; border: 1px solid var(--hair); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; font-size: 14px; }
  .crit .opts { display: flex; flex-wrap: wrap; gap: 4px; }
  .btn.on { border-color: var(--green); background: var(--green-soft); color: var(--green); font-weight: 700; }
  .opts { display: flex; flex-wrap: wrap; gap: 4px; }
  .opt { font-size: 12px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--hair); background: var(--bg); color: var(--ink); cursor: pointer; }
  .crit .opt { font-size: 12px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--hair); background: var(--bg); color: var(--ink); cursor: pointer; }
  .crit .opt.on { border-color: var(--green); background: var(--green-soft); color: var(--green); font-weight: 700; }
  .crit .tabs { display: flex; gap: 4px; }
  .crit .tabs button { flex: 1; padding: 5px 0; border-radius: 6px; border: 1.5px solid var(--hair); background: var(--surface); color: var(--ink); cursor: pointer; font-size: 13px; }
  .crit .tabs button.on { border-color: var(--green); color: var(--green); font-weight: 700; }
  .crit .route { display: flex; align-items: flex-start; gap: 6px; font-size: 13px; }
  .crit .route .rn { flex: 1; cursor: pointer; }
  .crit .route .x { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; }
  .crit .cat { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .crit .opt.part { border-color: var(--green); border-style: dashed; }
  .crit .opt.small { padding: 3px 6px; color: var(--muted); }
  .crit .opts.chome { margin: 2px 0 6px 12px; }
  .crit .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .crit .chk { font-size: 13px; }
  .crit .unit { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
  .crit .unit span { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .btn.save { background: var(--green); color: #fff; border-color: var(--green); font-weight: 700; }
  .btn.save.line { background: #06c755; border-color: #06c755; }
  .form { width: 100%; height: 820px; border: 1px solid var(--hair); border-radius: 8px; margin-top: 6px; background: #fff; }
  .memo { width: 100%; min-height: 120px; margin-top: 4px; padding: 8px; border: 1px solid var(--hair); border-radius: 8px;
    background: var(--bg); color: var(--ink); font: inherit; font-size: 14px; resize: vertical; }
  .ask { margin-top: 8px; font-weight: 700; color: var(--green); }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; display: none; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 12px; }
  /* 知らせそのものが「読み直す」ボタン。暗い画面でも読めるよう、ページの色（--red / --red-soft / --ink）だけで塗る */
  .news { font: inherit; font-size: 13px; font-weight: 700; color: var(--ink); background: var(--red-soft);
    border: 1.5px solid var(--red); border-radius: 8px; padding: 6px 12px; cursor: pointer; text-align: left; }
  .news[hidden] { display: none; }
  /* 承認ページを右からスライドで出す（保存だけ。送るのはCRMから） */
  .slide-bg { position: fixed; inset: 0; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; }
  .slide-bg.on { opacity: 1; pointer-events: auto; }
  .slide { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--surface);
    box-shadow: -6px 0 24px rgba(0,0,0,.18); transform: translateX(100%); transition: transform .25s ease; z-index: 51;
    display: flex; flex-direction: column; }
  .slide.on { transform: translateX(0); }
  .slide .sh { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--hair); }
  .slide .sh b { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slide .sbody { flex: 1; overflow-y: auto; padding: 4px 16px 24px; }
  .eimgs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .eimg { position: relative; width: 132px; border: 1px solid var(--hair); border-radius: 6px; overflow: hidden; background: var(--bg); cursor: grab; }
  .eimg { width: 160px; }
  .eimg img { display: block; width: 100%; height: 120px; object-fit: contain; background: #fff; }   /* 間取り図などが見切れないように全体を出す */
  .eimg.off { cursor: pointer; opacity: .55; }
  .eimg.off:hover { opacity: 1; }
  .eimg .no { position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; padding: 0 5px; border-radius: 4px; }
  .eimg .eb { display: flex; }
  .eimg .eb button { flex: 1; border: 0; border-top: 1px solid var(--hair); background: var(--surface); color: var(--ink); padding: 3px 0; cursor: pointer; font-size: 12px; }
  .ef { display: grid; grid-template-columns: 9em 1fr; gap: 4px 10px; align-items: center; margin-top: 4px; }
  .ef label { font-size: 12px; color: var(--muted); }
  .slide a { color: var(--green); }
  .slide .elinks { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
  .slide .elinks a { text-decoration: none; border: 1px solid var(--hair); border-radius: 6px; padding: 6px 12px; font-size: 13px; }
  .slide.drop .sbody { outline: 3px dashed var(--green); outline-offset: -6px; }
  .eimg .zm { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,.6); color: #fff; border: 0; border-radius: 4px; font-size: 12px; padding: 0 6px; cursor: zoom-in; }
  .lb { position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 60; display: flex; align-items: center; justify-content: center; }
  .lb[hidden] { display: none; }
  .lb img { max-width: 92vw; max-height: 86vh; object-fit: contain; }
  .lb .lbn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.15); color: #fff; border: 0; font-size: 28px; padding: 10px 16px; cursor: pointer; border-radius: 8px; }
  .lb .lbc { position: absolute; bottom: 18px; color: #fff; font-size: 13px; }
  .ef input, .ef textarea { width: 100%; padding: 5px 8px; border: 1px solid var(--hair); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>顧客管理</h1>
    <span class="meta" id="saving"></span>
    <button class="news" id="news" hidden onclick="reload()"></button>
    <button class="btn" id="reloadBtn" onclick="reload()" title="読み直す">🔄</button>
    <button class="btn save" onclick="openAdd()">＋ お客様を追加</button>
    <button class="btn" onclick="toggleMenu()">☰</button>
  </header>
  <div class="menu" id="menu" style="display:none">
    <button class="btn" id="importBtn" onclick="importNow()">📥 問い合わせ取込</button>
    <a class="btn" id="searchLink">🔍 物件検索を回す</a>
    <a class="btn" id="adminLink" target="_blank">管理画面</a>
    <button class="btn" id="dupBtn" onclick="reviewDup()">🧹 重複リード確認</button>
    <button class="btn" id="pendBtn" onclick="reviewPending()">🧹 承認待ち整理</button>
    <a class="btn" id="cfLink" target="_blank" style="display:none">⚡ Cloudflare版を開く</a>
  </div>
  <input type="search" id="q" class="search" placeholder="名前で探す" oninput="search()">
  <div class="today" id="today"></div>
  <div class="ttasks" id="todayTasks"></div>
  <div class="layout">
    <div class="tree" id="tree"></div>
    <aside class="panel" id="panel"></aside>
    <aside class="panel props" id="props"></aside>
  </div>
  <div class="foot" id="foot"></div>
</div>
<div class="toast" id="toast"></div>
<div class="slide-bg" id="slideBg" onclick="closeEdit()"></div>
<div class="slide" id="slide"><div class="sh"><b id="slideTitle"></b><button class="btn save" onclick="saveEdit()">保存する</button><button class="btn" onclick="closeEdit()">✕ 閉じる</button></div><div class="sbody" id="slideBody"></div></div>
<div class="lb" id="lb" hidden onclick="if(event.target===this)lbClose()"><button class="lbn" style="left:16px" onclick="lbGo(-1)">‹</button><img id="lbImg"><button class="lbn" style="right:16px" onclick="lbGo(1)">›</button><div class="lbc" id="lbCap"></div></div>

<script>
  var data = JSON.parse('<?!= treeJson ?>');
  var customerPageUrl = JSON.parse('<?!= customerPageUrl ?>');
  var adminUrl = JSON.parse('<?!= adminUrl ?>');
  var approveBaseUrl = JSON.parse('<?!= approveBaseUrl ?>');
  var mobileSearchUrl = JSON.parse('<?!= mobileSearchUrl ?>');
  var MASTER = JSON.parse('<?!= masterJson ?>');
  // GAS版だけ: Cloudflare版を開くリンク（Cloudflare版では __boot に cfUrl が無いので出ない）
  try { var _cfu = (typeof __boot === 'undefined') ? JSON.parse('<?!= cfUrl ?>') : ''; if (_cfu) { var _cl = document.getElementById('cfLink'); _cl.href = _cfu; _cl.style.display = ''; } } catch (eCf) {}
  var sel = '';    // 選んでいる箱
  var askNext = '', askEnd = '', askViewing = '', askTalk = '';
  var talkDraft = {};   // 顧客名 → 話せたときのメモと結果（記録するまで持っておく）   // いま質問を出している顧客
  document.getElementById('adminLink').href = adminUrl;
  document.getElementById('searchLink').href = mobileSearchUrl;
  var labelOf = {};

  // 名前で探すとき、異体字（髙→高 など）と空白の違いは同じとみなす
  var ITAIJI = { '髙': '高', '﨑': '崎', '嵜': '崎', '邊': '辺', '邉': '辺', '齋': '斎', '齊': '斉', '濵': '浜', '濱': '浜',
    '德': '徳', '惠': '恵', '櫻': '桜', '澤': '沢', '廣': '広', '龍': '竜', '國': '国', '眞': '真', '冨': '富', '藏': '蔵',
    '槇': '槙', '曻': '昇', '彌': '弥', '實': '実', '條': '条', '瀨': '瀬', '戶': '戸', '舘': '館', '﨔': '欅', '塚': '塚', '祐': '祐' };
  function normName(s) {
    return String(s || '').replace(/[\s　]/g, '').replace(/./g, function (ch) { return ITAIJI[ch] || ch; }).toLowerCase();
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function depthOf(n) {
    var d = 0, p = n.parent;
    while (p) {
      d++;
      var up = data.nodes.filter(function (x) { return x.id === p; })[0];
      p = up ? up.parent : '';
    }
    return d;
  }

  function metaOf(c) {
    var m = [];
    if (c.daysSinceInquiry !== null && c.daysSinceInquiry !== undefined) m.push('反響から' + c.daysSinceInquiry + '日');
    if (c.callSlots && (c.node === 'callQueue' || c.node === 'callWait')) m.push('架電 ' + c.callSlots);
    else if (c.failedCalls) m.push('つながらず' + c.failedCalls + '回');
    if (c.lastTalkAt) m.push('最後に話した ' + c.lastTalkAt);
    if (c.daysSinceSent !== null && c.daysSinceSent !== undefined) m.push('最終送信 ' + c.daysSinceSent + '日前');
    if (c.moveIn) m.push('引越し ' + c.moveIn);
    if (c.endWhy) m.push('終了: ' + c.endWhy);
    if (c.tasks && c.tasks.length) m.push('予定: ' + c.tasks.join('、'));
    return m.join(' ・ ');
  }

  function custHtml(c) {
    var name = c.lineOnly ? esc(c.name)
      : '<a target="_blank" href="' + esc(customerPageUrl + '&customer=' + encodeURIComponent(c.name)) + '">' + esc(c.name) + '</a>';
    var tel = c.phone ? ' <a class="meta" href="tel:' + esc(c.phone) + '">📞 ' + esc(c.phone) + '</a>' : '';
    var h = '<div class="cust"><div class="name">' + name + tel + '</div>';
    if (c.note) h += '<div class="note">' + esc(c.note) + '</div>';
    if (c.viewNote) h += '<div class="meta">👀 ' + esc(c.viewNote) + '</div>';
    var meta = metaOf(c);
    if (meta) h += '<div class="meta">' + esc(meta) + '</div>';
    if (c.nextAuto) h += '<div class="auto">🤖 次の自動: ' + esc(c.nextAuto) + '</div>';
    if (c.lineOnly) {
      // 名前の無いLINEの友だち。記録はLINEだけ（返信したら押す）
      h += '<div class="acts"><button class="btn" onclick="rec(' + esc(JSON.stringify(c.name)) + ',\'LINE\')">📨 LINEした</button></div>';
    }
    if (!c.lineOnly) {
      var n = esc(JSON.stringify(c.name));
      if (askTalk === c.name) {
        // 話せた: メモと結果をいっしょに残す
        var tk = talkDraft[c.name] = talkDraft[c.name] || { memo: '', outcome: '', when: '', reason: '' };
        h += '<div class="ask">話した内容</div>'
          + '<textarea class="memo" placeholder="例: 11月に引越し。家賃は9万まで上げてもよい" oninput="talkDraft[selName].memo=this.value">' + esc(tk.memo) + '</textarea>'
          + '<div class="ask">結果</div><div class="acts">'
          + [['continue', 'このまま物件を送る'], ['recall', 'かけ直し'], ['end', '終了']].map(function (o) {
            return '<button class="btn' + (tk.outcome === o[0] ? ' on' : '') + '" onclick="talkDraft[selName].outcome=\'' + o[0] + '\';render()">' + o[1] + '</button>';
          }).join('') + '</div>';
        if (tk.outcome === 'recall') {
          h += '<div class="ask">かけ直す日（時刻は入れなくてもよい）</div><div class="acts">'
            + '<input type="date" class="btn" value="' + esc(tk.when) + '" onchange="talkDraft[selName].when=this.value">'
            + '<input type="time" class="btn" value="' + esc(tk.time || '') + '" onchange="talkDraft[selName].time=this.value"></div>';
        }
        if (tk.outcome === 'end') {
          h += '<div class="ask">終了の理由</div><div class="acts">' + ['他社で決定', '条件が合わない', '引越し中止', '音信不通', 'その他'].map(function (r) {
            return '<button class="btn' + (tk.reason === r ? ' on' : '') + '" onclick="talkDraft[selName].reason=\'' + r + '\';render()">' + r + '</button>';
          }).join('') + '</div>';
        }
        h += '<div class="acts"><button class="btn save" onclick="saveTalk()">記録する</button>'
          + '<button class="btn" onclick="askTalk=\'\';render()">やめる</button></div>';
      } else if (askNext === c.name) {
        // 記録した直後・「次に赤くする日」を押したとき: 次に連絡する日を決める。その日まで赤くしない
        h += '<div class="ask">次に連絡する日は？（その日まで赤くしません）</div><div class="acts">'
          + [[1, '明日'], [3, '3日後'], [7, '1週間後'], [14, '2週間後'], [0, '決めない']].map(function (d) {
            return '<button class="btn" onclick="next(' + n + ',' + d[0] + ')">' + d[1] + '</button>';
          }).join('') + '</div>';
      } else if (askEnd === c.name) {
        h += '<div class="ask">終了の理由は？</div><div class="acts">'
          + ['音信不通', '他社で決定', '条件が合わない', '引越し中止', 'その他'].map(function (r) {
            return '<button class="btn" onclick="stage(' + n + ',\'終了\',\'' + r + '\')">' + r + '</button>';
          }).join('') + '<button class="btn" onclick="askEnd=\'\';render()">やめる</button></div>';
      } else if (askViewing === c.name) {
        h += '<div class="ask">内見の日は？</div><div class="acts">'
          + '<input type="date" id="vdate" class="btn">'
          + '<button class="btn" onclick="viewing(' + n + ')">決定</button>'
          + '<button class="btn" onclick="askViewing=\'\';render()">やめる</button></div>';
      } else {
        h += '<div class="acts">'
          + '<button class="btn" onclick="askTalk=' + n + ';render()">📞 話せた</button>'
          + '<button class="btn" onclick="rec(' + n + ',\'電話（つながらず）\')">📵 つながらず</button>'
          + '<button class="btn" onclick="rec(' + n + ',\'LINE\')">📨 LINEした</button>'
          + '<button class="btn" onclick="askNext=' + n + ';render()">🕒 次に赤くする日</button>'
          + '<button class="btn" title="今日だけ黒くする（明日また赤くなる）" onclick="next(' + n + ',1)">⚫ 今日はいい</button>'
          + '</div><div class="acts small">';
        if (c.stageId === 'ended' || c.stageId === 'won') {
          h += '<button class="btn" onclick="stage(' + n + ',\'\',\'\')">↩ 追客中に戻す</button>';
        } else {
          h += '<button class="btn" onclick="askViewing=' + n + ';render()">👀 内見の予定</button>';
          if (c.stage !== '申込') h += '<button class="btn" onclick="stage(' + n + ',\'申込\',\'\')">申込にする</button>';
          h += '<button class="btn" onclick="stage(' + n + ',\'成約\',\'\')">成約にする</button>'
            + '<button class="btn" onclick="askEnd=' + n + ';render()">終了にする</button>';
        }
        h += '</div>';
      }
    }
    return h + '</div>';
  }

  // ── 第2版: 段階の横に名前を並べる ──
  var selName = '';          // 右に出している顧客
  // 閉じておく段階（押すと並べる）。メールだけの人はこちらからできることが無いので閉じる
  var COLLAPSED = { mail: true, ended: true };
  var opened = {};

  function stageKids(id) { return data.stages.filter(function (s) { return s.parent === id; }); }
  function inStage(id) { return data.customers.filter(function (c) { return c.stageId === id; }); }
  function stageTotal(id) {
    return inStage(id).length + stageKids(id).reduce(function (a, k) { return a + stageTotal(k.id); }, 0);
  }

  function chipHtml(c) {
    var cls = 'chip' + (c.todo ? ' todo' : (c.stageId === 'ended' || c.stageId === 'mail' || c.contactedToday ? ' done' : ''))
      + (selName === c.name ? ' sel' : '');
    var flags = (c.flags || []).map(function (f) { return '<span class="flag">' + esc(f) + '</span>'; }).join('');
    return '<span class="' + cls + '" onclick="pickCust(' + esc(JSON.stringify(c.name)) + ')">'
      + '<span class="nm">' + esc(c.name) + '</span>'
      + (c.chipStatus ? '<span class="st">' + esc(c.chipStatus) + '</span>' : '') + flags + '</span>';
  }

  function stageHtml(s) {
    var list = inStage(s.id);
    // 赤い人を先に、次に合図のある人
    list.sort(function (a, b) { return (b.todo - a.todo) || ((b.flags || []).length - (a.flags || []).length); });
    var kids = stageKids(s.id);
    var total = stageTotal(s.id);
    // 閉じておく段階は、段階の名前を押して開いたり閉じたりする
    var fold = COLLAPSED[s.id] && list.length;
    var label = '<span class="label' + (kids.length ? ' grp' : '') + (fold ? ' fold' : '') + '"'
      + (fold ? ' onclick="opened[\'' + s.id + '\']=!opened[\'' + s.id + '\'];render()"' : '') + '>'
      + (fold ? (opened[s.id] ? '▾ ' : '▸ ') : '') + esc(s.label) + ' <span class="n">' + total + '</span></span>';
    var chips = (COLLAPSED[s.id] && !opened[s.id]) ? '' : list.map(chipHtml).join('');
    var html = '<li><div class="stage">' + label + chips + '</div>';
    if (kids.length) html += '<ul>' + kids.map(stageHtml).join('') + '</ul>';
    return html + '</li>';
  }

  function groupButtons(c) {
    if (!c.hasCriteria) return '';
    var n = esc(JSON.stringify(c.name));
    return '<div class="abc">' + ['A', 'B', 'C'].map(function (g) {
      return '<button class="' + (c.group === g ? 'on' : '') + '" onclick="setGroup(' + n + ',\'' + (c.group === g ? '' : g) + '\')">'
        + g + '</button>';
    }).join('') + '</div><div class="meta">A 本気で探している（電話・内見などで話して分かった）／ B 返事はくれる ／ C 返事なし</div>';
  }

  function render() {
    var red = data.customers.filter(function (c) { return c.todo; }).length;
    var done = data.customers.filter(function (c) { return c.contactedToday && c.stageId !== 'ended' && c.stageId !== 'won'; }).length;
    renderTodayTasks();
    var today = document.getElementById('today');
    today.className = 'today' + (red ? '' : ' zero');
    today.innerHTML = red ? '今日まだ連絡していない <b>' + red + '</b> 人 ／ 連絡済み ' + done + ' 人'
      : '今日の連絡は全員済みです（' + done + ' 人）';

    data.stages.forEach(function (s) { labelOf[s.id] = s.label; });
    var q = (document.getElementById('q').value || '').trim().toLowerCase();
    var tree = document.getElementById('tree');
    if (q) {
      var nq = normName(q);
      var hits = data.customers.filter(function (c) { return normName(c.name).indexOf(nq) >= 0; });
      tree.innerHTML = '<div class="meta">「' + esc(q) + '」' + hits.length + '人</div><div class="hits">'
        + hits.map(function (c) { return '<div>' + chipHtml(c) + ' <span class="meta">' + esc(labelOf[c.stageId] || '') + '</span></div>'; }).join('') + '</div>';
    } else {
      var roots = data.stages.filter(function (s) { return !s.parent; });
      tree.innerHTML = '<ul>' + roots.map(stageHtml).join('') + '</ul>';
    }

    var panel = document.getElementById('panel');
    // 条件フォームは描き直しても作り直さない（入力中の内容が消えないように）
    var keepForm = document.getElementById('critForm');
    if (keepForm) keepForm.parentNode.removeChild(keepForm);
    var c = data.customers.filter(function (x) { return x.name === selName; })[0];
    if (addMode) { panel.innerHTML = addHtml(); }
    else panel.innerHTML = c
      ? '<div class="where">いる段階: ' + esc(labelOf[c.stageId] || '') + (c.chipStatus ? '・' + esc(c.chipStatus) : '') + '</div>'
        + groupButtons(c) + custHtml(c)
        + ((c.flags || []).length ? '<div class="meta">' + (c.flags || []).map(esc).join(' ') + '</div>' : '')
        + tasksHtml(c)
        + extraHtml(c)
      : '<div class="meta">名前を押すと、ここにその人が出ます。もう一度押すと閉じます。</div>';
    document.getElementById('foot').textContent = '';
    // 送る物件は別の列に出す
    var props = document.getElementById('props');
    props.innerHTML = c ? '<div class="where">' + esc(c.name) + ' さんに送る</div>' + sendHtml(c)
      : '<div class="meta">名前を押すと、その人に送る物件がここに並びます。</div>';
    var slot = document.getElementById('formSlot');
    if (slot) {
      var url = slot.getAttribute('data-url');
      var f = (keepForm && keepForm.getAttribute('data-url') === url) ? keepForm : null;
      if (!f) {
        f = document.createElement('iframe');
        f.id = 'critForm'; f.className = 'form'; f.src = url; f.setAttribute('data-url', url);
      }
      slot.appendChild(f);
    }
  }

  // ── やること（タスク）──
  var todayYmd = function () { var d = new Date(Date.now() + 9 * 3600000); return d.toISOString().slice(0, 10); };
  var mdOf = function (ymd) { return ymd ? Number(ymd.slice(5, 7)) + '/' + Number(ymd.slice(8, 10)) : ''; };
  // お客様の欄の「やること」: 済んでいないものを期日順に。期日が来たものは🔴
  function tasksHtml(c) {
    if (c.stageId === 'ended' || c.lineOnly) return '';
    var x = extras[c.name] || (extras[c.name] = {});
    var t0 = todayYmd(), list = c.taskList || [];
    var h = '<div class="sec">やること' + (list.length ? '（' + list.length + '件）' : '') + '</div><div class="tasks">';
    h += list.map(function (t) {
      var a = esc(JSON.stringify(t.row)) + ',' + esc(JSON.stringify(t.content));
      var due = t.due && t.due <= t0;
      var wait = t.owner && t.owner !== '自分';   // 相手待ち。期日は催促する日
      return '<div class="task' + (due ? ' due' : '') + (wait ? ' wait' : '') + '"><div class="ttop"><span class="tdate">' + (due ? '🔴 ' : '') + (t.due ? (wait ? '催促 ' : '') + mdOf(t.due) : '期日なし') + '</span>'
        + '<span class="tbody">' + (wait ? '<span class="twait">⏳' + esc(t.owner) + '待ち</span> ' : '') + esc(t.content) + '</span></div><span class="tbtns">'
        + '<select class="tdin" title="誰の番か" onchange="taskOwner(' + a + ',this.value)">' + ['自分', 'お客さん', '管理会社'].map(function (o) {
          return '<option value="' + o + '"' + ((t.owner || '自分') === o ? ' selected' : '') + '>' + (o === '自分' ? '自分の番' : o + '待ち') + '</option>';
        }).join('') + '</select>'
        + (x.taskEdit === t.row ? '<input type="date" class="tdin" value="' + esc(t.due) + '" onchange="taskDue(' + a + ',this.value)">'
          : '<a href="#" onclick="taskDone(' + a + ');return false">済み</a><a href="#" onclick="extras[selName].taskEdit=' + esc(JSON.stringify(t.row)) + ';render();return false">日付</a>'
          + '<a href="#" class="skip" onclick="taskDel(' + a + ');return false">消す</a>')
        + '</span></div>';
    }).join('') || '<div class="meta">やることはありません</div>';
    h += '</div><div class="tadd"><input id="taskNew" class="inp" placeholder="やること（例: 申込書を送る）" value="' + esc(x.taskDraft || '') + '" oninput="extras[selName].taskDraft=this.value">'
      + '<select class="tdin" title="誰の番か" onchange="extras[selName].taskDraftOwner=this.value">' + ['自分', 'お客さん', '管理会社'].map(function (o) {
          return '<option value="' + o + '"' + ((x.taskDraftOwner || '自分') === o ? ' selected' : '') + '>' + (o === '自分' ? '自分の番' : o + '待ち') + '</option>';
        }).join('') + '</select>'
      + '<input id="taskNewDue" type="date" class="tdin" title="期日（待ちのときは催促する日）" value="' + esc(x.taskDraftDue || '') + '" onchange="extras[selName].taskDraftDue=this.value">'
      + '<button class="btn" onclick="taskAdd()">＋足す</button></div>';
    return h;
  }
  function taskAdd() {
    var name = selName, x = extras[name], content = (x.taskDraft || '').trim(), due = x.taskDraftDue || '', owner = x.taskDraftOwner || '自分';
    if (!content) { toast('やることを入れてください'); return; }
    if (owner !== '自分' && !due) { toast('待ちのときは、催促する日を入れてください'); return; }
    x.taskDraft = ''; x.taskDraftDue = ''; x.taskDraftOwner = '';
    call('addCrmTask', [name, content, due, owner], 'やることを足しました', function (c) { (c.taskList = c.taskList || []).push({ row: -1, content: content, due: due, owner: owner }); });
  }
  function taskDone(row, content) {
    call('doneCrmTask', [selName, row, content], '済みにしました', function (c) { c.taskList = (c.taskList || []).filter(function (t) { return !(t.row === row && t.content === content); }); });
  }
  function taskOwner(row, content, owner) {
    call('setCrmTaskOwner', [selName, row, content, owner], owner === '自分' ? '自分の番にしました' : owner + '待ちにしました', function (c) { (c.taskList || []).forEach(function (t) { if (t.row === row && t.content === content) t.owner = owner; }); });
  }
  function taskDel(row, content) {
    call('deleteCrmTask', [selName, row, content], '消しました', function (c) { c.taskList = (c.taskList || []).filter(function (t) { return !(t.row === row && t.content === content); }); });
  }
  function taskDue(row, content, due) {
    var x = extras[selName]; x.taskEdit = null;
    call('setCrmTaskDue', [selName, row, content, due], '期日を直しました', function (c) { (c.taskList || []).forEach(function (t) { if (t.row === row && t.content === content) t.due = due; }); });
  }
  // 画面上部の「今日のやること」: 期日が来たタスクを全員分。押すとその人を開く。これからの分は日ごとの件数だけ
  var todayTasksOpen = true;
  try { todayTasksOpen = localStorage.getItem('crmTodayTasks') !== '0'; } catch (e) {}
  function toggleTodayTasks() { todayTasksOpen = !todayTasksOpen; try { localStorage.setItem('crmTodayTasks', todayTasksOpen ? '1' : '0'); } catch (e) {} renderTodayTasks(); }
  function renderTodayTasks() {
    var el = document.getElementById('todayTasks'); if (!el) return;
    var t0 = todayYmd(), due = [], later = {};
    data.customers.forEach(function (c) {
      if (c.stageId === 'ended' || c.stageId === 'won') return;
      (c.taskList || []).forEach(function (t) {
        if (!t.due) return;
        if (t.due <= t0) due.push({ name: c.name, t: t });
        else if (t.due <= new Date(Date.now() + 9 * 3600000 + 7 * 86400000).toISOString().slice(0, 10)) later[t.due] = (later[t.due] || 0) + 1;
      });
    });
    due.sort(function (a, b) { return a.t.due < b.t.due ? -1 : 1; });
    var ks = Object.keys(later).sort();
    if (!due.length && !ks.length) { el.innerHTML = ''; return; }
    var h = '<div class="tthead" onclick="toggleTodayTasks()">' + (todayTasksOpen ? '▾' : '▸') + ' 今日のやること <b>' + due.length + '</b> 件</div>';
    if (todayTasksOpen) {
      h += due.map(function (d) {
        return '<div class="ttrow" onclick="pickCust(' + esc(JSON.stringify(d.name)) + ')"><b>' + esc(d.name) + '</b> <span>' + (d.t.owner && d.t.owner !== '自分' ? '催促（' + esc(d.t.owner) + '待ち）: ' : '') + esc(d.t.content) + '</span>'
          + (d.t.due < t0 ? ' <span class="meta">（' + mdOf(d.t.due) + '〜）</span>' : '') + '</div>';
      }).join('');
      if (ks.length) h += '<div class="meta">これから: ' + ks.map(function (k) { return mdOf(k) + ' ' + later[k] + '件'; }).join('・') + '</div>';
    }
    el.innerHTML = h;
  }
  function pickCust(name) {
    addMode = false;
    // 同じ名前をもう一度押したら右を閉じる
    if (selName === name) { selName = ''; askNext = askEnd = askViewing = ''; render(); return; }
    selName = name;
    askNext = askEnd = askViewing = askTalk = '';
    loadExtra(name);
    render();
    prefetchFor(name);
    if (!listCache[name] && !prefetching) loadLists(name);   // 取ってあれば取り直さない
    if (window.innerWidth < 860) document.getElementById('panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ── 右側の追加情報（問い合わせた物件・条件を入れる・メモ）。画面を開いた時点で全員分を持っている ──
  var extras = {};   // 顧客名 → { memo, memoDraft, formUrl, formLoading }
  function loadExtra(name) {
    if (extras[name]) return;
    var c = data.customers.filter(function (x) { return x.name === name; })[0] || {};
    extras[name] = { memo: c.memo || '', memoDraft: c.memo || '' };
  }
  function extraHtml(c) {
    loadExtra(c.name);
    var x = extras[c.name];
    var n = esc(JSON.stringify(c.name));
    var h = linkHtml(c);
    h += '<div class="sec">問い合わせた物件</div>';
    h += c.inquiries && c.inquiries.length ? c.inquiries.map(function (q) {
      var title = esc(q.property || '（物件名なし）') + (q.rent ? ' ' + esc(q.rent) : '') + (q.layout ? ' ' + esc(q.layout) : '');
      return '<div class="inq">' + esc(q.date) + ' '
        + (q.url ? '<a target="_blank" href="' + esc(q.url) + '">' + title + '</a>' : title)
        + ((q.area || q.station || q.address) ? '<div class="meta">' + esc([q.area, q.station, q.address].filter(Boolean).join('・')) + '</div>' : '')
        + (q.content ? '<div class="meta">' + esc(q.content) + '</div>' : '') + '</div>';
    }).join('') : '<div class="meta">問い合わせの記録はありません</div>';

    h += '<div class="sec">条件</div>' + critHtml(c);

    h += '<div class="sec">メモ（お客様には見えません）</div>'
      + '<textarea id="memo" class="memo" oninput="memoInput(' + n + ',this.value)" onblur="memoSave(' + n + ')">' + esc(x.memoDraft) + '</textarea>'
      + '<div class="meta" id="memoState">' + (x.memoDraft !== x.memo ? '未保存' : (x.memo ? '保存済み' : '')) + '</div>';
    return h;
  }
  // ── 条件入力（この画面用。お客様用フォームは使わない） ──
  var LAYOUTS = ['ワンルーム','1K','1DK','1LDK','2K','2DK','2LDK','3K','3DK','3LDK','4K以上'];
  var WALKS = ['']; for (var wi = 1; wi <= 20; wi++) WALKS.push(wi + '分以内');
  var AREAS = ['', '15m²','20m²','25m²','30m²','35m²','40m²','45m²','50m²','55m²','60m²'];
  var AGES = ['', '新築','1年以内','2年以内','3年以内','4年以内','5年以内','10年以内','15年以内','20年以内','25年以内','30年以内','35年以内','40年以内'];
  var STRUCTS = ['鉄筋系','鉄骨系','木造','ブロック・その他'];

  function critOf(name) {
    var x = extras[name];
    if (!x.crit) {
      var c = data.customers.filter(function (y) { return y.name === name; })[0] || {};
      var src = c.criteria || {};
      x.crit = JSON.parse(JSON.stringify({
        areaMethod: src.areaMethod || 'route', routes: src.routes || {}, cities: src.cities || [], towns: src.towns || {},
        rentMax: src.rentMax || '', layouts: src.layouts || [], walk: src.walk || '', areaMin: src.areaMin || '',
        age: src.age || '', structures: src.structures || [], equipment: src.equipment || [],
        moveIn: src.moveIn || '', moveInStrict: !!src.moveInStrict, notes: src.notes || '',
        petType: src.petType || '', carModel: src.carModel || ''
      }));
      x.critOpenRoute = '';
    }
    return x.crit;
  }
  function chips(list, selected, onclick) {
    return '<div class="opts">' + list.map(function (v) {
      var on = selected.indexOf(v) >= 0;
      return '<button class="opt' + (on ? ' on' : '') + '" onclick="' + onclick + '(' + esc(JSON.stringify(v)) + ')">' + esc(v) + '</button>';
    }).join('') + '</div>';
  }
  function selectHtml(list, value, field, labelEmpty) {
    return '<select class="inp" onchange="critSet(\'' + field + '\',this.value)">' + list.map(function (v) {
      return '<option value="' + esc(v) + '"' + (v === value ? ' selected' : '') + '>' + esc(v || labelEmpty) + '</option>';
    }).join('') + '</select>';
  }
  function critHtml(c) {
    if (c.lineOnly) return '<div class="meta">名前がまだ分からないので、条件は入れられません。LINEで名前を聞いてから入れてください。</div>';
    var f = critOf(c.name), x = extras[c.name];
    var h = '<div class="crit">';
    h += '<div class="tabs"><button class="' + (f.areaMethod !== 'city' ? 'on' : '') + '" onclick="critSet(\'areaMethod\',\'route\',true)">路線・駅</button>'
      + '<button class="' + (f.areaMethod === 'city' ? 'on' : '') + '" onclick="critSet(\'areaMethod\',\'city\',true)">市区町村</button></div>';
    if (f.areaMethod !== 'city') {
      Object.keys(f.routes).forEach(function (rn) {
        var stas = f.routes[rn] || [];
        var open = x.critOpenRoute === rn;
        h += '<div class="route"><span class="rn" onclick="openRoute(' + esc(JSON.stringify(rn)) + ')">' + (open ? '▾ ' : '▸ ') + esc(rn)
          + ' <span class="meta">' + (stas.length ? stas.map(esc).join('・') : '駅を選んでいません') + '</span></span>'
          + '<button class="x" onclick="removeRoute(' + esc(JSON.stringify(rn)) + ')">×</button></div>';
        if (open) h += chips(MASTER.stations[rn] || [], stas, 'toggleStation');
      });
      h += '<input class="inp" id="staQ" placeholder="駅名で探す（例: 自由が丘）" oninput="staSearch(this.value)" autocomplete="off">'
        + '<div class="opts" id="staHits"></div>';
      h += '<select class="inp" onchange="addRoute(this.value)"><option value="">＋ 路線を足す</option>'
        + MASTER.routeCompanies.map(function (co) {
          return '<optgroup label="' + esc(co.label) + '">' + co.routes.filter(function (r) { return !(r in f.routes); }).map(function (r) {
            return '<option value="' + esc(r) + '">' + esc(r) + '</option>';
          }).join('') + '</optgroup>';
        }).join('') + '</select>';
    } else {
      // 選んだ市区ごとに、町名・丁目まで絞れる（空なら市区全域）
      f.cities.forEach(function (city) {
        var ts = (f.towns && f.towns[city]) || [];
        var open = x.openCity === city;
        h += '<div class="route"><span class="rn" onclick="openCity(' + esc(JSON.stringify(city)) + ')">' + (open ? '▾ ' : '▸ ') + esc(city)
          + ' <span class="meta">' + (ts.length ? '町名 ' + ts.length + '件' : '全域') + '</span></span>'
          + '<button class="x" onclick="toggleCity(' + esc(JSON.stringify(city)) + ')">×</button></div>';
        if (open) h += townHtml(city, ts, x);
      });
      h += '<label class="fl">市区を足す</label>' + chips(MASTER.cities, f.cities, 'toggleCity');
    }
    h += '<label class="fl">賃料の上限（万円）</label><input class="inp" type="number" step="0.5" min="0" value="' + esc(f.rentMax) + '" placeholder="指定なし" oninput="critSet(\'rentMax\',this.value)">';
    h += '<label class="fl">間取り</label>' + chips(LAYOUTS, f.layouts, 'toggleLayout');
    h += '<div class="row3"><div><label class="fl">駅徒歩</label>' + pickOrType(WALKS, f.walk, 'walk', '分以内') + '</div>'
      + '<div><label class="fl">広さ</label>' + pickOrType(AREAS, f.areaMin, 'areaMin', 'm²') + '</div>'
      + '<div><label class="fl">築年数</label>' + pickOrType(AGES, f.age, 'age', '年以内') + '</div></div>';
    h += '<label class="fl">建物の構造</label>' + chips(STRUCTS, f.structures, 'toggleStruct');
    h += '<label class="fl">こだわり</label>' + MASTER.equipment.map(function (cat) {
      return '<div class="cat">' + esc(cat.name) + '</div>' + chips(cat.items, f.equipment, 'toggleEquip');
    }).join('');
    if (f.equipment.indexOf('ペット相談可') >= 0)
      h += '<label class="fl">ペットの種類</label><input class="inp" value="' + esc(f.petType) + '" placeholder="例: 小型犬、猫" oninput="critSet(\'petType\',this.value)">';
    if (f.equipment.indexOf('駐車場あり') >= 0)
      h += '<label class="fl">車種</label><input class="inp" value="' + esc(f.carModel) + '" placeholder="例: 軽自動車" oninput="critSet(\'carModel\',this.value)">';
    h += '<label class="fl">引越し時期</label>' + moveInHtml(f)
      + '<label class="chk"><input type="checkbox"' + (f.moveInStrict ? ' checked' : '') + ' onchange="critSet(\'moveInStrict\',this.checked)"> この時期は厳守</label>';
    h += '<label class="fl">その他</label><textarea class="inp" rows="2" oninput="critSet(\'notes\',this.value)">' + esc(f.notes) + '</textarea>';
    h += '<div class="acts"><button class="btn save" onclick="saveCrit(false)">' + (x.critSaving ? '保存中…' : '保存する') + '</button>'
      + (c.lineUid ? '<button class="btn save line" onclick="saveCrit(true)">保存してLINEで送る</button>' : '') + '</div>'
      + (c.lineUid ? '<div class="meta">「LINEで送る」を押すと、お客様に条件のカードが届きます。</div>' : '<div class="meta">LINEがつながっていないので、お客様には届きません。</div>');
    return h + '</div>';
  }
  // 選択肢から選ぶか、「その他」で数字を入れる（広さ・築年数・徒歩）
  function pickOrType(list, value, field, unit) {
    var custom = value && list.indexOf(value) < 0;
    var x = extras[selName] || {};
    var typing = custom || (x.typing && x.typing[field]);
    var h2 = '<select class="inp" onchange="pickOrTypeSel(\'' + field + '\',this.value)">'
      + list.map(function (v) { return '<option value="' + esc(v) + '"' + (!typing && v === value ? ' selected' : '') + '>' + esc(v || '指定なし') + '</option>'; }).join('')
      + '<option value="__type"' + (typing ? ' selected' : '') + '>その他（入力）</option></select>';
    if (typing) {
      var num = String(value || '').replace(/[^0-9.]/g, '');
      h2 += '<div class="unit"><input class="inp" type="number" min="0" step="1" value="' + esc(num) + '" oninput="critSet(\'' + field + '\', this.value ? this.value + \'' + unit + '\' : \'\')"><span>' + esc(unit) + '</span></div>';
    }
    return h2;
  }
  function pickOrTypeSel(field, v) {
    var x = extras[selName]; x.typing = x.typing || {};
    if (v === '__type') { x.typing[field] = true; critOf(selName)[field] = ''; }
    else { x.typing[field] = false; critOf(selName)[field] = v; }
    render();
  }

  // 引越し時期: LINE と同じく「月 → 上旬/中旬/下旬/日付」か「いい物件見つかり次第」
  function moveInParts(s) {
    s = String(s || '');
    if (/見つかり次第|すぐ/.test(s)) return { mode: 'asap' };
    var m;
    if ((m = s.match(/(\d{1,2})月(上旬|中旬|下旬)/))) return { mode: 'month', month: +m[1], period: m[2] };
    if ((m = s.match(/(\d{1,2})月(\d{1,2})日/))) return { mode: 'month', month: +m[1], period: '日付', day: +m[2] };
    if ((m = s.match(/\d{4}[\/-](\d{1,2})[\/-](\d{1,2})/))) return { mode: 'month', month: +m[1], period: '日付', day: +m[2] };
    if ((m = s.match(/(\d{1,2})月/))) return { mode: 'month', month: +m[1], period: '' };
    return { mode: '' };
  }
  function moveInHtml(f) {
    var p = moveInParts(f.moveIn);
    var now = new Date(), months = [];
    for (var i = 0; i < 13; i++) months.push(((now.getMonth() + i) % 12) + 1);
    var h2 = '<div class="opts"><button class="opt' + (p.mode === 'asap' ? ' on' : '') + '" onclick="setMoveIn(\'asap\')">いい物件見つかり次第</button>'
      + '<button class="opt' + (!p.mode ? ' on' : '') + '" onclick="setMoveIn(\'\')">未定・聞いていない</button></div>';
    h2 += '<div class="opts">' + months.map(function (mo) {
      return '<button class="opt' + (p.mode === 'month' && p.month === mo ? ' on' : '') + '" onclick="setMoveIn(\'m\',' + mo + ')">' + mo + '月</button>';
    }).join('') + '</div>';
    if (p.mode === 'month') {
      h2 += '<div class="opts">' + ['上旬', '中旬', '下旬', '日付'].map(function (pe) {
        return '<button class="opt' + (p.period === pe ? ' on' : '') + '" onclick="setMoveIn(\'p\',\'' + pe + '\')">' + pe + '</button>';
      }).join('') + '</div>';
      if (p.period === '日付') {
        // その月の日数だけ出す。今月より前の月は来年とみなす（うるう年も new Date が面倒を見る）
        var thisMonth = new Date().getMonth() + 1;
        var year = new Date().getFullYear() + (p.month < thisMonth ? 1 : 0);
        var last = new Date(year, p.month, 0).getDate();
        var days = []; for (var d = 1; d <= last; d++) days.push(d);
        h2 += '<select class="inp" onchange="setMoveIn(\'d\',this.value)">' + days.map(function (d) {
          return '<option value="' + d + '"' + (p.day === d ? ' selected' : '') + '>' + p.month + '月' + d + '日</option>';
        }).join('') + '</select>';
      }
    }
    return h2;
  }
  function setMoveIn(kind, v) {
    var f = critOf(selName), p = moveInParts(f.moveIn);
    if (kind === 'asap') f.moveIn = 'いい物件見つかり次第';
    else if (kind === '') f.moveIn = '';
    else if (kind === 'm') f.moveIn = v + '月' + (p.period && p.period !== '日付' ? p.period : (p.period === '日付' ? (p.day || 1) + '日' : ''));
    else if (kind === 'p') f.moveIn = (p.month || (new Date().getMonth() + 1)) + '月' + (v === '日付' ? (p.day || 1) + '日' : v);
    else if (kind === 'd') f.moveIn = (p.month || (new Date().getMonth() + 1)) + '月' + v + '日';
    render();
  }

  // ── 町名・丁目（管理画面と同じ公開データ geolonia から取る） ──
  var townCache = {};
  function townGroups(city) {
    var data = townCache[city];
    if (!data || data === 'loading' || data === 'error') return null;
    var groups = {}, order = [];
    data.forEach(function (t) {
      var name = t.town; if (!name) return;
      var m = name.match(/^(.+?)([一二三四五六七八九十百]+丁目)$/);
      var base = m ? m[1] : name;
      if (!groups[base]) { groups[base] = []; order.push(base); }
      groups[base].push(name);
    });
    return { groups: groups, order: order };
  }
  function openCity(city) {
    var x = extras[selName]; x.openCity = (x.openCity === city) ? '' : city; x.openBase = '';
    if (x.openCity && !townCache[city]) {
      townCache[city] = 'loading';
      fetch('https://geolonia.github.io/japanese-addresses/api/ja/東京都/' + encodeURIComponent(city) + '.json')
        .then(function (r) { return r.json(); })
        .then(function (d) { townCache[city] = d; render(); })
        .catch(function () { townCache[city] = 'error'; render(); });
    }
    render();
  }
  function townHtml(city, selected, x) {
    if (townCache[city] === 'loading') return '<div class="meta">町名を読み込み中…</div>';
    if (townCache[city] === 'error') return '<div class="meta">町名を読み込めませんでした</div>';
    var g = townGroups(city); if (!g) return '';
    var qs = function (s) { return esc(JSON.stringify(s)); };
    var h2 = '<div class="meta">町名を選ぶと、その町だけに絞ります（何も選ばなければ全域）</div><div class="opts">';
    g.order.forEach(function (base) {
      var towns = g.groups[base];
      var n = towns.filter(function (t) { return selected.indexOf(t) >= 0; }).length;
      var on = n === towns.length, part = n > 0 && !on;
      h2 += '<button class="opt' + (on ? ' on' : (part ? ' part' : '')) + '" onclick="toggleTownBase(' + qs(city) + ',' + qs(base) + ')">' + esc(base)
        + (towns.length > 1 ? ' <span class="meta">' + (n ? n + '/' : '') + towns.length + '</span>' : '') + '</button>';
      if (towns.length > 1) h2 += '<button class="opt small" onclick="openBase(' + qs(base) + ')">' + (x.openBase === base ? '▴' : '丁目▾') + '</button>';
      if (x.openBase === base && towns.length > 1) {
        h2 += '</div><div class="opts chome">' + towns.map(function (t) {
          return '<button class="opt' + (selected.indexOf(t) >= 0 ? ' on' : '') + '" onclick="toggleTown(' + qs(city) + ',' + qs(t) + ')">' + esc(t.replace(base, '') || t) + '</button>';
        }).join('') + '</div><div class="opts">';
      }
    });
    return h2 + '</div>';
  }
  function townsOf(city) { var f = critOf(selName); f.towns = f.towns || {}; f.towns[city] = f.towns[city] || []; return f.towns[city]; }
  function toggleTown(city, t) { toggleIn(townsOf(city), t); render(); }
  function toggleTownBase(city, base) {
    var list = townsOf(city), towns = townGroups(city).groups[base];
    var all = towns.every(function (t) { return list.indexOf(t) >= 0; });
    towns.forEach(function (t) { var i = list.indexOf(t); if (all && i >= 0) list.splice(i, 1); if (!all && i < 0) list.push(t); });
    render();
  }
  function openBase(base) { var x = extras[selName]; x.openBase = (x.openBase === base) ? '' : base; render(); }

  // 駅名で探す（通話しながらでも早く選べるように）
  function staSearch(q) {
    q = String(q || '').trim();
    var box = document.getElementById('staHits');
    if (!box) return;
    if (!q) { box.innerHTML = ''; return; }
    var f = critOf(selName), hits = [];
    Object.keys(MASTER.stations).forEach(function (rn) {
      (MASTER.stations[rn] || []).forEach(function (st) {
        if (st.indexOf(q) >= 0 && hits.length < 30) hits.push({ rn: rn, st: st, on: (f.routes[rn] || []).indexOf(st) >= 0 });
      });
    });
    box.innerHTML = hits.length ? hits.map(function (x) {
      return '<button class="opt' + (x.on ? ' on' : '') + '" onclick="addStation(' + esc(JSON.stringify(x.rn)) + ',' + esc(JSON.stringify(x.st)) + ')">'
        + esc(x.st) + ' <span class="meta">' + esc(x.rn) + '</span></button>';
    }).join('') : '<span class="meta">見つかりません</span>';
  }
  function addStation(rn, st) {
    var f = critOf(selName);
    if (!f.routes[rn]) f.routes[rn] = [];
    toggleIn(f.routes[rn], st);
    if (!f.routes[rn].length) delete f.routes[rn];
    var q = (document.getElementById('staQ') || {}).value || '';
    render();
    var inp = document.getElementById('staQ');
    if (inp) { inp.value = q; inp.focus(); staSearch(q); }
  }

  function critSet(field, v, rerender) { var f = critOf(selName); f[field] = v; if (rerender) render(); }
  function toggleIn(arr, v) { var i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); }
  function toggleLayout(v) { toggleIn(critOf(selName).layouts, v); render(); }
  function toggleStruct(v) { toggleIn(critOf(selName).structures, v); render(); }
  function toggleEquip(v) { toggleIn(critOf(selName).equipment, v); render(); }
  function toggleCity(v) {
    var f = critOf(selName); toggleIn(f.cities, v);
    if (f.cities.indexOf(v) < 0 && f.towns) delete f.towns[v];   // 市区を外したら町名も外す
    render();
  }
  function addRoute(rn) { if (!rn) return; var f = critOf(selName); f.routes[rn] = []; extras[selName].critOpenRoute = rn; render(); }
  function removeRoute(rn) { delete critOf(selName).routes[rn]; render(); }
  function openRoute(rn) { var x = extras[selName]; x.critOpenRoute = (x.critOpenRoute === rn) ? '' : rn; render(); }
  function toggleStation(v) { var x = extras[selName]; toggleIn(critOf(selName).routes[x.critOpenRoute], v); render(); }
  // 押したらすぐ終わったことにして、保存は裏で（順番待ちの列）。フォームは入れた内容のまま。
  // 保存が終わったとき、そのあと書き換えていなければサーバーの値に入れ替える。失敗したら知らせて、入れた内容は残す。
  function saveCrit(send) {
    var name = selName, x = extras[name];
    var sent = JSON.stringify(x.crit || null);
    toast(send ? '保存してお客様に送ります（裏で）' : '保存しました');
    Q()
      .withSuccessHandler(function (d) {
        if (JSON.stringify(x.crit || null) === sent) x.crit = null;
        applyResult(d); render();
        if (send || d.savedMessage) toast(d.savedMessage || '保存しました');
      })
      .withFailureHandler(function (e) { toast(name + 'さんの条件を保存できませんでした: ' + e.message + '（入れた内容は残っています。もう一度押してください）'); render(); })
      .saveCrmCriteria(name, x.crit, !!send);
  }

  // ── 送る（物件の横並びカード＋スタッフの一言） ──
  function dearOf(c) {
    if (c.lineOnly) return '';
    var parts = String(c.name).split(/[\s　]+/);
    return (parts.length > 1 ? parts[0] : c.name) + 'さま、';
  }
  var TEMPLATES = [
    { label: '物件を送る', text: '{宛名}ご希望に近いお部屋がありましたのでお送りします。\n気になるお部屋があれば、お気軽にお知らせください。' },
    { label: '様子を聞く', text: '{宛名}その後、お部屋探しの状況はいかがでしょうか。\nもう少しこういうお部屋がいい、などございましたら、お気軽にお知らせください。' },
    { label: '電話の打診', text: '{宛名}お探しのご条件の詳細をいただきありがとうございます。\n\n担当の西村と申します。\nいただいておりますご条件を拝見しまして、お電話で5分程度お話をお伺いすることは可能でしょうか。\n\n少しでもご希望に合った物件をお送りするために、もしよろしければご対応をいただけますと幸いです。\n何卒、よろしくお願いいたします。' }
  ];
  // ── 送る物件の列: タブ（新着・送った・見送った・キャンセル待ち）＋下に送る欄 ──
  // どのタブで選んだ物件も、下の「LINEで送る」でまとめて送る（送った＝送り直し、見送った＝やっぱり送る）。
  var listCache = {};   // 顧客名 → { sent:[], skipped:[] } または 'loading'
  function loadLists(name) {
    if (listCache[name] === 'loading') return;
    listCache[name] = 'loading';
    google.script.run
      .withSuccessHandler(function (l) { listCache[name] = l; if (selName === name) render(); })
      .withFailureHandler(function (e) { delete listCache[name]; toast('送った物件を読めませんでした: ' + e.message); })
      .getCrmPropLists(name);
  }
  // ページを開いたら、全員分の「送った・見送った」を裏で1回だけ取っておく（名前を押したら一瞬で出す）
  var prefetching = false;
  function prefetchAllLists() {
    var names = data.customers.filter(function (c) { return c.stageId !== 'ended' && c.stageId !== 'won' && !c.lineOnly; }).map(function (c) { return c.name; });
    prefetching = true;
    google.script.run
      .withSuccessHandler(function (all) {
        prefetching = false;
        names.forEach(function (n) { if (!listCache[n] || listCache[n] === 'loading') listCache[n] = (all && all[n]) || { sent: [], skipped: [] }; });
        if (selName) render();
      })
      .withFailureHandler(function () { prefetching = false; if (selName) render(); })
      .getCrmPropListsAll(names);
  }

  function forwardOpen(rid) { var x = extras[selName]; x.fwdRoom = (x.fwdRoom === rid) ? '' : rid; x.fwdQ = ''; render(); }
  function forwardTo(rid, toName) {

  // 賃料などが数字だけで入っているとき「17万円」「5,000円」と読める形にする

  // ── キャンセル待ち ──

  // 送った物件を募集終了にする。お客様の物件ページと地図に「募集終了」と出る（LINEは送らない）

  function setWatch(rid, on) {

  // 選んだ新着をまとめて見送る（画面からはすぐ消し、保存は裏で）

  var gsQueue = Promise.resolve(), pendingBy = {}, ownWins = [];
  // ── 「新しい動きがあります」: CRMの外（Discordからの送信・お客様の条件変更・LINEの返信・検索の新着など）で変わったら知らせる ──
  // 自動では読み直さない（15秒かかり、操作中に表示が入れ替わると押し間違える）。知らせて、押したら読み直す。

      var why = Object.keys(r.whys || {}).filter(function (k) { return r.whys[k] > seenVer && !mine(r.whys[k]); });

  function Q() {
    var ok = function () {}, ng = function () {};
    var h = {
      withSuccessHandler: function (f) { ok = f; return px; },
      withFailureHandler: function (f) { ng = f; return px; }
    };
    var px = new Proxy(h, { get: function (t, k) {
      if (k in t) return t[k];
      return function () {
        var args = Array.prototype.slice.call(arguments), who = typeof args[0] === 'string' ? args[0] : '';
        // Cloudflare版: 画面の組み立て直しは押した瞬間にやる（列に並ぶのは保存だけ）。続けて押しても待たない
        if (window.__localFirst) { try { window.__localFirst(k, args); } catch (eL) {} }
        pendingBy[who] = (pendingBy[who] || 0) + 1;
        updateSaving();
        var win = { s: Date.now() - 3000, e: Infinity };   // 自分の保存の時間帯（知らせに出さない）
        ownWins.push(win);
        gsQueue = gsQueue.then(function () {
          return new Promise(function (done) {
            var r = google.script.run
              .withSuccessHandler(function (d) { pendingBy[who]--; win.e = Date.now() + 3000; updateSaving(); try { ok(d); } finally { done(); } })
              .withFailureHandler(function (e) { pendingBy[who]--; win.e = Date.now() + 3000; updateSaving(); try { ng(e); } finally { done(); } });
            r[k].apply(r, args);
          });
        });
      };
    } });

  }
  function savingTotal() { return Object.keys(pendingBy).reduce(function (a, k) { return a + (pendingBy[k] || 0); }, 0); }

  // サーバーの答えを画面に入れる。1人分ならその人だけ差し替え。同じ人の保存がまだ控えていれば待つ（途中の結果で巻き戻さない）
  function applyResult(d) {
    if (d && d.onlyName !== undefined && ('one' in d)) {
      if ((pendingBy[d.onlyName] || 0) > 0) return;
      var i = -1;
      data.customers.forEach(function (c, k) { if (c.name === d.onlyName) i = k; });
      if (d.one) { if (i >= 0) data.customers[i] = d.one; else data.customers.push(d.one); }

  // Cloudflare版: 写しの差分を取り込んだら、全員分を組み立て直す（boot.js から呼ぶ）。

  var recomputeWanted = false;

    var i = -1;

        var accident = res.accident || [], suspicious = res.suspicious || [], normal = res.normal || [];
        if (!accident.length && !suspicious.length) {
          alert('削除対象の承認待ち（事故分）はありません。\n（承認待ち合計: ' + (res.total || 0) + '件）');
          return;
        }
        var msg = '承認待ちの事故分を削除します。\n\n';
        if (accident.length) msg += '【条件なしの顧客＝事故・全削除】\n'
          + accident.map(function (c) { return '・' + c.name + ': ' + c.count + '件'; }).join('\n') + '\n\n';
        if (normal.length) msg += '【条件あり・少件数＝残す】\n'
          + normal.map(function (c) { return '・' + c.name + ': ' + c.count + '件'; }).join('\n') + '\n\n';
        msg += 'まず上記「条件なしの顧客」の承認待ちを削除します。よろしいですか？';
        if (accident.length && !confirm(msg)) return;
        var extra = [];
        if (suspicious.length && confirm('次の顧客は「検索条件あり」ですが承認待ちが大量です（事故で混ざった可能性）。\n\n'
          + suspicious.map(function (c) { return '・' + c.name + ': ' + c.count + '件'; }).join('\n')
          + '\n\nこれらの承認待ちも削除しますか？\n（OK=削除する / キャンセル=残す）')) {
          extra = suspicious.map(function (c) { return c.name; });
        }
        busy('pendBtn', '削除中…');
        google.script.run
          .withSuccessHandler(function (r) { busy('pendBtn'); toast('承認待ちの事故分を削除しました: ' + ((r && r.removed) || 0) + '件'); })
          .withFailureHandler(function (e) { busy('pendBtn'); toast('削除エラー: ' + e.message); })
          .deletePendingForCleanup(extra);
      })
      .withFailureHandler(function (e) { busy('pendBtn'); toast('確認エラー: ' + e.message); })
      .previewPendingCleanup();
  }

  // ── 物件をCRMの中で直す（承認ページを読み込まないので即開く）──
  // お客様を選んだら、新着の中身を裏で先に取っておく。押した瞬間に出せるように。
  var detailCache = {};   // 顧客名 → { roomId: {fields, all, selected, cats, comment, url} }
  var savingCount = 0;
  var ED_LABELS = [
    ['物件', [['buildingName', '物件名'], ['roomNumber', '部屋番号'], ['layout', '間取り'], ['area', '面積(m²)'], ['buildingAge', '築年数'],
      ['floorText', '所在階'], ['storyText', '階建て'], ['structure', '構造'], ['totalUnits', '総戸数'], ['sunlight', '主要採光面'], ['moveInDate', '入居可能時期']]],
    ['アクセス', [['stationInfo', '最寄駅'], ['address', '住所'], ['otherStations', '他の最寄駅', 1]]],
    ['お金', [['rent', '賃料(円)'], ['managementFee', '管理費(円)'], ['deposit', '敷金'], ['keyMoney', '礼金'], ['shikibiki', '敷引き/償却'],
      ['petDeposit', 'ペット敷金追加'], ['renewalFee', '更新料'], ['fireInsurance', '火災保険', 1], ['renewalAdminFee', '更新事務手数料'],
      ['guaranteeInfo', '保証料', 1], ['cleaningFee', 'クリーニング費用'], ['keyExchangeFee', '鍵交換費用'], ['supportFee24h', '24時間サポート費'],
      ['rightsFee', '権利金'], ['additionalDeposit', '敷金積み増し'], ['guaranteeDeposit', '保証金'], ['waterBilling', '水道料金形態'],
      ['parkingFee', '駐車場'], ['bicycleParkingFee', '駐輪場'], ['motorcycleParkingFee', 'バイク置き場'], ['otherMonthlyFee', 'その他月次費用'], ['otherOnetimeFee', 'その他一時金']]],
    ['契約', [['leaseType', '契約区分'], ['contractPeriod', '契約期間'], ['cancellationNotice', '解約予告'], ['renewalInfo', '更新/再契約'],
      ['freeRent', 'フリーレント'], ['freeRentDetail', 'フリーレント詳細'], ['moveOutDate', '退去日'], ['moveInConditions', '入居条件', 1], ['layoutDetail', '間取り詳細']]],
    ['設備', [['facilities', '設備', 1]]]
  ];
  function prefetchDetails(name, ids) {
    detailCache[name] = detailCache[name] || {};
    var need = ids.filter(function (r) { return !detailCache[name][r]; });
    if (!need.length) return;
    need.forEach(function (r) { detailCache[name][r] = 'loading'; });
    google.script.run
      .withSuccessHandler(function (d) {
        need.forEach(function (r) { if (detailCache[name][r] === 'loading') delete detailCache[name][r]; });
        Object.keys(d || {}).forEach(function (r) { detailCache[name][r] = d[r]; });
        if (ed && ed.name === name && !ed.d) openEdit(ed.roomId);   // 待っていた物件が届いた
      })
      .withFailureHandler(function () { need.forEach(function (r) { delete detailCache[name][r]; }); })
      .getCrmPropertyDetails(name, need);
  }
  function prefetchFor(name) {
    var c = data.customers.filter(function (x) { return x.name === name; })[0];
    if (!c || !c.pending || !c.pending.length) return;
    prefetchDetails(name, c.pending.slice(0, 12).map(function (p) { return p.roomId; }));
  }

  var ed = null;   // 開いている編集 { name, roomId, d, sel:[], comment }
  function openEdit(roomId) {
    var name = selName;
    var c = data.customers.filter(function (x) { return x.name === name; })[0];
    var p = c && (c.pending || []).filter(function (x) { return x.roomId === roomId; })[0];
    document.getElementById('slideTitle').textContent = p ? (p.building + (p.room ? ' ' + p.room : '')) : '';
    var d = detailCache[name] && detailCache[name][roomId];
    if (!d || d === 'loading') {
      ed = { name: name, roomId: roomId, d: null };
      document.getElementById('slideBody').innerHTML = '<div class="meta" style="padding:30px;text-align:center">読み込み中…</div>';
      if (!d) prefetchDetails(name, [roomId]);
    } else {
      ed = { name: name, roomId: roomId, d: d, sel: d.selected.slice(), comment: d.comment, fields: JSON.parse(JSON.stringify(d.fields)) };
      drawEdit();
    }
    document.getElementById('slide').classList.add('on');
    document.getElementById('slideBg').classList.add('on');
  }
  function drawEdit() {
    var d = ed.d, h = '';
    h += '<div class="sec">一言（カードに載ります）</div><textarea class="memo" style="min-height:70px" oninput="ed.comment=this.value">' + esc(ed.comment || '') + '</textarea>';
    h += '<div class="sec">送る写真（' + ed.sel.length + '枚・左から順に出ます。ドラッグでも並び替えできます）</div><div class="eimgs">'
      + ed.sel.map(function (u, i) {
        return '<div class="eimg" draggable="true" ondragstart="edDrag=' + i + '" ondragend="edDrag=-1" ondragover="event.preventDefault()" ondrop="edDrop(' + i + ')">'
          + '<img src="' + esc(u) + '" loading="lazy" onclick="lbOpen(ed.sel,' + i + ')" style="cursor:zoom-in"><span class="no">' + (i + 1) + (d.cats[u] ? ' ' + esc(d.cats[u]) : '') + '</span>'
          + '<div class="eb"><button onclick="edMove(' + i + ',-1)">◀</button><button onclick="edDel(' + i + ')">✕</button><button onclick="edMove(' + i + ',1)">▶</button></div></div>';
      }).join('') + '</div>';
    var unused = d.all.filter(function (u) { return ed.sel.indexOf(u) < 0; });
    h += '<div class="sec">使わない写真（押すと最後に足します）</div><div class="eimgs">'
      + (unused.length ? unused.map(function (u) {
        return '<div class="eimg off" onclick="edAdd(' + esc(JSON.stringify(u)) + ')"><img src="' + esc(u) + '" loading="lazy">' + (d.cats[u] ? '<span class="no">' + esc(d.cats[u]) + '</span>' : '')
          + '<button class="zm" onclick="event.stopPropagation();lbOpen(edUnused(),' + esc(JSON.stringify(unused.indexOf(u))) + ')">🔍</button></div>';
      }).join('') : '<div class="meta">ありません</div>') + '</div>';
    h += '<label class="btn" style="display:inline-block;margin-top:6px">＋ 写真を足す<input type="file" accept="image/*" multiple hidden onchange="edUpload(this.files)"></label> <span class="meta">この画面に写真をドラッグ、またはスクショを ⌘V で貼り付けても足せます</span> <span class="meta" id="edUp"></span>';
    ED_LABELS.forEach(function (g) {
      h += '<div class="sec">' + esc(g[0]) + '</div><div class="ef">';
      g[1].forEach(function (f) {
        var v = ed.fields[f[0]] || '';
        h += '<label>' + esc(f[1]) + '</label>' + (f[2]
          ? '<textarea rows="2" oninput="ed.fields[\'' + f[0] + '\']=this.value;edFit(this)">' + esc(v) + '</textarea>'
          : '<input value="' + esc(v) + '" oninput="ed.fields[\'' + f[0] + '\']=this.value">');
      });
      h += '</div>';
    });
    h += '<div class="elinks">' + (d.url ? '<a target="_blank" href="' + esc(d.url) + '">↗ 物件の元のページ（いえらぶ・REINS など）</a>' : '')
      + '<a target="_blank" href="' + esc(approveBaseUrl + '&customer=' + encodeURIComponent(ed.name) + '&room_id=' + encodeURIComponent(ed.roomId)) + '">↗ これまでの承認ページで開く（AI整理を使うとき）</a></div>';
    var body = document.getElementById('slideBody'), top = body.scrollTop;
    body.innerHTML = h;
    // 長い欄（設備など）は最初から全部見えるように高さを合わせる
    Array.prototype.forEach.call(body.querySelectorAll('.ef textarea'), edFit);
    body.scrollTop = top;
  }
  function edFit(t) { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 4) + 'px'; }
  function edUnused() { return ed.d.all.filter(function (u) { return ed.sel.indexOf(u) < 0; }); }

  // 写真を大きく見る（← → で送る、Escで閉じる）
  var lbList = [], lbI = 0;
  function lbOpen(list, i) { lbList = list.slice(); lbI = i; lbShow(); document.getElementById('lb').hidden = false; }
  function lbShow() { document.getElementById('lbImg').src = lbList[lbI] || ''; document.getElementById('lbCap').textContent = (lbI + 1) + ' / ' + lbList.length; }
  function lbGo(d) { if (!lbList.length) return; lbI = (lbI + d + lbList.length) % lbList.length; lbShow(); }
  function lbClose() { document.getElementById('lb').hidden = true; }
  function lbOpenNow() { return !document.getElementById('lb').hidden; }

  // 写真をドラッグで足す（スクショ・デスクトップの画像・別のページの画像）／⌘V で貼り付け
  (function () {
    var sl = document.getElementById('slide');
    sl.addEventListener('dragover', function (ev) {
      if (!ed || !ed.d || edDrag >= 0) return;   // 写真の並び替え中は除く
      ev.preventDefault(); sl.classList.add('drop');
    });
    sl.addEventListener('dragleave', function (ev) { if (ev.target === sl || !sl.contains(ev.relatedTarget)) sl.classList.remove('drop'); });
    sl.addEventListener('drop', function (ev) {
      sl.classList.remove('drop');
      if (!ed || !ed.d || edDrag >= 0) return;
      ev.preventDefault();
      var dt = ev.dataTransfer, files = Array.prototype.filter.call(dt.files || [], function (f) { return /^image\//.test(f.type); });
      if (files.length) { edUpload(files); return; }
      var u = (dt.getData('text/uri-list') || dt.getData('text/plain') || '').split('\n')[0].trim();
      if (/^https?:\/\//.test(u)) { ed.d.all.push(u); ed.sel.push(u); drawEdit(); toast('写真を足しました（保存のときに置き直します）'); }
      else toast('写真を読み取れませんでした');
    });
    document.addEventListener('paste', function (ev) {
      if (!ed || !ed.d) return;
      var items = (ev.clipboardData && ev.clipboardData.items) || [], files = [];
      for (var i = 0; i < items.length; i++) if (items[i].kind === 'file' && /^image\//.test(items[i].type)) files.push(items[i].getAsFile());
      if (!files.length) return;   // 文字の貼り付けはそのまま
      ev.preventDefault(); edUpload(files);
    });
  })();
  var edDrag = -1;
  function edDrop(i) { if (edDrag < 0 || edDrag === i) return; var u = ed.sel.splice(edDrag, 1)[0]; ed.sel.splice(i, 0, u); edDrag = -1; drawEdit(); }
  function edMove(i, dir) { var j = i + dir; if (j < 0 || j >= ed.sel.length) return; var t = ed.sel[i]; ed.sel[i] = ed.sel[j]; ed.sel[j] = t; drawEdit(); }
  function edDel(i) { ed.sel.splice(i, 1); drawEdit(); }
  function edAdd(u) { ed.sel.push(u); drawEdit(); }
  function edUpload(files) {
    var cur = ed, list = Array.prototype.slice.call(files || []), left = list.length;
    if (!left) return;
    document.getElementById('edUp').textContent = '上げています…（' + left + '枚）';
    list.forEach(function (file) {
      var rd = new FileReader();
      rd.onload = function () {
        var b64 = String(rd.result).split(',')[1];
        google.script.run
          .withSuccessHandler(function (r) {
            left--;
            if (r && r.success && r.url) { cur.d.all.push(r.url); cur.sel.push(r.url); }
            else toast('写真を上げられませんでした');
            if (ed === cur) { drawEdit(); var s = document.getElementById('edUp'); if (s) s.textContent = left ? '上げています…（残り' + left + '枚）' : ''; }
          })
          .withFailureHandler(function (e) { left--; toast('写真を上げられませんでした: ' + e.message); })
          .uploadPropertyImage(b64, file.name, file.type);
      };
      rd.readAsDataURL(file);
    });
  }
  function saveEdit() {
    if (!ed || !ed.d) return;
    if (!ed.sel.length) { toast('写真を1枚以上残してください'); return; }
    var cur = ed;
    // 先にカードへ反映して閉じる。保存は裏で（写真の置き直しで数秒かかることがある）
    var c = data.customers.filter(function (x) { return x.name === cur.name; })[0];
    var p = c && (c.pending || []).filter(function (x) { return x.roomId === cur.roomId; })[0];
    if (p) {
      p.image = cur.sel[0]; p.images = cur.sel.slice(0, 6); p.imgCount = cur.sel.length; p.edited = true; p.comment = (cur.comment || '').trim();
      p.building = cur.fields.buildingName; p.room = cur.fields.roomNumber; p.rent = cur.fields.rent; p.fee = cur.fields.managementFee;
      p.layout = cur.fields.layout; p.area = cur.fields.area; p.age = cur.fields.buildingAge; p.floor = cur.fields.floorText; p.station = cur.fields.stationInfo;
    }
    cur.d.selected = cur.sel.slice(); cur.d.comment = cur.comment; cur.d.fields = cur.fields;
    savingCount++;
    closeEdit();
    render();
    toast('保存しています…');
    google.script.run
      .withSuccessHandler(function (r) {
        savingCount--;
        if (r && r.images && r.images.length) { cur.d.selected = r.images.slice(); cur.d.all = cur.d.all.map(function (u) { var i = cur.sel.indexOf(u); return i >= 0 && r.images[i] ? r.images[i] : u; }); if (p) { p.image = r.images[0]; p.images = r.images.slice(0, 6); } render(); }
        toast('保存しました');
      })
      .withFailureHandler(function (e) { savingCount--; delete detailCache[cur.name][cur.roomId]; toast('保存できませんでした: ' + e.message); })
      .saveCrmPropertyEdit(cur.name, cur.roomId, cur.fields, cur.sel, cur.comment);
  }
  function closeEdit() {
    document.getElementById('slide').classList.remove('on');
    document.getElementById('slideBg').classList.remove('on');
    ed = null;
  }
  document.addEventListener('keydown', function (ev) {
    if (lbOpenNow()) {
      if (ev.key === 'Escape') lbClose(); else if (ev.key === 'ArrowLeft') lbGo(-1); else if (ev.key === 'ArrowRight') lbGo(1);
      return;
    }
    if (ev.key === 'Escape' && ed) closeEdit();
  });

  function reload() {
    toast('読み込み中…');
    google.script.run
      .withSuccessHandler(function (d) { applyResult(d); if (d.ver) seenVer = d.ver; document.getElementById('news').hidden = true; document.getElementById('reloadBtn').hidden = false; listCache = {}; prefetchAllLists(); render(); toast('最新にしました'); })   // CRMの外（Discord・REINSパネル）で送った分も出す
      .withFailureHandler(function (e) { toast('読み込めませんでした: ' + e.message); })
      .getCrmTreeForPage();
  }

  render();
</script>
</body>
</html>
