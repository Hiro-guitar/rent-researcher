<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>空室確認の回答</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f5f7fa;margin:0;padding:16px;color:#1a2538}
    .card{background:#fff;border-radius:12px;padding:20px;max-width:560px;margin:0 auto;box-shadow:0 4px 16px rgba(0,0,0,.08)}
    h2{margin:0 0 4px;font-size:18px;color:#3d6909}
    .meta{font-size:13px;color:#6b7280;margin-bottom:14px}
    .item{border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin-bottom:10px}
    .src{font-size:13px;word-break:break-all;margin-bottom:6px}
    .src a{color:#2563eb}
    .auto{font-size:12px;color:#6b7280;margin-bottom:8px}
    .choice{display:flex;gap:8px;margin-bottom:8px}
    .choice label{flex:1;text-align:center;padding:10px 4px;border-radius:8px;border:2px solid #d1d5db;font-size:14px;cursor:pointer;user-select:none}
    .choice input{display:none}
    .choice input:checked+span{font-weight:bold}
    .choice label.av:has(input:checked){border-color:#16a34a;background:#ecfdf5;color:#166534}
    .choice label.cl:has(input:checked){border-color:#dc2626;background:#fef2f2;color:#991b1b}
    .lbl{width:100%;box-sizing:border-box;padding:8px;border:1px solid #d1d5db;border-radius:6px;font-size:14px}
    .lbl-h{font-size:12px;color:#6b7280;margin:0 0 4px}
    textarea{width:100%;box-sizing:border-box;padding:8px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;min-height:60px}
    .sec{margin-top:14px}
    .sec h3{font-size:14px;margin:0 0 6px}
    .btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:#6ea814;color:#fff;font-size:16px;font-weight:bold;margin-top:16px;cursor:pointer}
    .btn:disabled{background:#9ca3af}
    .note{margin-top:14px;padding:12px;background:#f0faf4;border-radius:8px;font-size:13px;color:#3d6909;display:none}
    .err{margin-top:14px;padding:12px;background:#fef2f2;border-radius:8px;font-size:13px;color:#9b1c1c;display:none}
    .done{color:#6b7280;font-size:12px;margin-top:8px}
    details summary{cursor:pointer;font-size:14px;color:#374151}
    .spec{display:none;border:1px solid #d9e6bf;background:#f8fbf2;border-radius:10px;padding:12px}
    .spec h3{color:#3d6909}
    .spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .spec-prev{margin-top:10px;font-size:13px;color:#3d6909;background:#fff;border-radius:6px;padding:8px;line-height:1.5}
    .spec-prev.off{color:#6b7280}
    .draft{font-size:12px;color:#6b7280;margin:0 0 8px}
    .chk{display:block;font-size:13px;padding:3px 0;cursor:pointer}
    .chk input{margin-right:6px}
  </style>
</head>
<body>
<div class="card">
  <h2>空室確認の回答</h2>
  <div class="meta" id="meta"></div>
  <div id="items"></div>

  <!-- 他社物件でもお客様に条件つきの2択カードを出すための欄。
       自社シートに無い物件は条件を機械的に作れないので、答えるついでに入れてもらう。
       任意。空なら今までどおり「お部屋を探す」だけの1択カードになる。 -->
  <div class="sec spec" id="specSec">
    <h3>ご案内不可のときの「近い条件」（任意）</h3>
    <p class="lbl-h" id="specHint"></p>
    <div class="spec-grid">
      <div>
        <p class="lbl-h">路線</p>
        <select class="lbl" id="spRoute"><option value="">(選ばない)</option></select>
      </div>
      <div>
        <p class="lbl-h">駅</p>
        <select class="lbl" id="spStation"><option value="">(選ばない)</option></select>
      </div>
      <div>
        <p class="lbl-h">賃料＋管理費（万円）</p>
        <input class="lbl" id="spRent" type="number" step="0.1" min="0" placeholder="例: 10.5">
      </div>
      <div>
        <p class="lbl-h">間取り</p>
        <select class="lbl" id="spLayout"><option value="">(選ばない)</option></select>
      </div>
      <div>
        <p class="lbl-h">専有面積</p>
        <select class="lbl" id="spArea"><option value="">(選ばない)</option></select>
      </div>
      <div>
        <p class="lbl-h">築年数</p>
        <select class="lbl" id="spAge"><option value="">(選ばない)</option></select>
      </div>
      <div>
        <p class="lbl-h">駅徒歩</p>
        <select class="lbl" id="spWalk"><option value="">(選ばない)</option></select>
      </div>
      <div>
        <p class="lbl-h">こだわり</p>
        <label class="chk"><input type="checkbox" id="spBt" value="バス・トイレ別"> バス・トイレ別</label>
        <label class="chk"><input type="checkbox" id="spWash" value="独立洗面台"> 独立洗面台</label>
      </div>
    </div>
    <div class="spec-prev" id="specPreview"></div>
  </div>

  <div class="sec">
    <h3>ひと言（任意）</h3>
    <textarea id="comment" placeholder="例: 2件目は先着で申込が入っています"></textarea>
  </div>

  <div class="sec">
    <details>
      <summary>定型に収まらないので自分で書いて返す</summary>
      <p class="lbl-h" style="margin-top:8px">ここに文章を入れると、上の選択は使わずこの文章だけを送ります。</p>
      <textarea id="freeText" placeholder="お待たせいたしました。…"></textarea>
    </details>
  </div>

  <button class="btn" id="submit">お客様に送信する</button>
  <div class="note" id="note"></div>
  <div class="err" id="err"></div>
  <div class="done" id="already"></div>
</div>

<script>
  var REQ = <?!= reqJson ?>;
  var API_KEY = <?!= JSON.stringify(apiKey) ?>;
  var STATIONS = <?!= stationData ?>;      // 路線名 → 駅名の配列
  var SPECS = <?!= specsJson ?>;           // 条件の下書き（物件ページから読めたときだけ）
  var LAYOUTS = ['ワンルーム','1K','1DK','1LDK','2K','2DK','2LDK','3K','3DK','3LDK','4K以上'];
  // 条件フォームと同じ刻み（ExistingBot.gs の SUUMO_*_STEPS）。ここに無い値は作らない。
  var AREA_STEPS = [20,25,30,35,40,45,50,55,60,65,70,80,90,100];   // m²以上
  var AGE_STEPS  = [1,3,5,7,10,15,20,25,30];                        // 年以内
  var WALK_STEPS = [1,5,7,10,15,20];                                // 分以内

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function autoText(j){
    if(j.auto==='available')return '自動判定: 🟢 募集中（'+esc(j.label)+'）';
    if(j.auto==='closed')return '自動判定: 🔴 ご案内不可（'+esc(j.label)+'）';
    if(j.tooMany)return '自動判定: 当たりが多すぎて特定できず';
    if(j.rowIdx&&j.rowIdx.length)return '自動判定: 要確認（'+esc(j.label)+'）';
    return '自動判定: 自社シートに無し';
  }

  document.getElementById('meta').textContent =
    (REQ.customerName||'(名前未登録)')+' 様 / '+REQ.items.length+'件 / 受付 '+REQ.receivedAt+' / '+REQ.id;

  var prev = {};
  if (REQ.answers && REQ.answers.answers) {
    REQ.answers.answers.forEach(function(a){ prev[a.n]=a; });
    document.getElementById('already').textContent =
      '※ '+REQ.answeredAt+' に一度回答済み（'+(REQ.status==='sent'?'送信済み '+(REQ.scheduledAt||''):'送信予定 '+(REQ.scheduledAt||'-'))+'）。送り直すと'+(REQ.status==='sent'?'もう1通届きます':'、まだ届いていなければ差し替わります')+'。';
    if (REQ.answers.comment) document.getElementById('comment').value = REQ.answers.comment;
    if (REQ.answers.freeText) document.getElementById('freeText').value = REQ.answers.freeText;
  }

  var html = '';
  REQ.items.forEach(function(j){
    var sel = prev[j.n] ? prev[j.n].answer : j.auto;
    var lbl = prev[j.n] && prev[j.n].label ? prev[j.n].label : j.label;
    html += '<div class="item" data-n="'+j.n+'">'
      + '<div class="src"><b>'+j.n+'.</b> '+(j.url?'<a href="'+esc(j.url)+'" target="_blank" rel="noopener">'+esc(j.url)+'</a>':esc(j.text))+'</div>'
      + '<div class="auto">'+autoText(j)+'</div>'
      + '<div class="choice">'
      + '<label class="av"><input type="radio" name="a'+j.n+'" value="available"'+(sel==='available'?' checked':'')+'><span>🟢 募集中</span></label>'
      + '<label class="cl"><input type="radio" name="a'+j.n+'" value="closed"'+(sel==='closed'?' checked':'')+'><span>🔴 ご案内不可</span></label>'
      + '</div>'
      + '<p class="lbl-h">お客様に見せる物件名（募集中のときに使います）</p>'
      + '<input class="lbl" name="l'+j.n+'" value="'+esc(lbl)+'">'
      + '</div>';
  });
  document.getElementById('items').innerHTML = html;

  // ─────────────────────────────────────────────
  //  「近い条件」の欄
  //  1件の依頼をご案内不可で返すときだけ意味がある。お客様に届くカードが
  //  「この条件で探しますか？」の2択になる。空のままなら「お部屋を探す」の1択。
  // ─────────────────────────────────────────────
  var elRoute=document.getElementById('spRoute'), elSta=document.getElementById('spStation');
  var elRent=document.getElementById('spRent'), elLay=document.getElementById('spLayout');
  var elArea=document.getElementById('spArea'), elAge=document.getElementById('spAge');
  var elWalk=document.getElementById('spWalk');
  var elBt=document.getElementById('spBt'), elWash=document.getElementById('spWash');
  var elSec=document.getElementById('specSec'), elPrev=document.getElementById('specPreview');

  Object.keys(STATIONS).forEach(function(r){
    elRoute.insertAdjacentHTML('beforeend','<option value="'+esc(r)+'">'+esc(r)+'</option>');
  });
  LAYOUTS.forEach(function(l){
    elLay.insertAdjacentHTML('beforeend','<option value="'+esc(l)+'">'+esc(l)+'</option>');
  });
  function fillSteps(el, steps, suffix){
    steps.forEach(function(v){
      el.insertAdjacentHTML('beforeend','<option value="'+v+'">'+v+suffix+'</option>');
    });
  }
  fillSteps(elArea, AREA_STEPS, 'm²以上');
  fillSteps(elAge,  AGE_STEPS,  '年以内');
  fillSteps(elWalk, WALK_STEPS, '分以内');

  function fillStations(keep){
    var list = STATIONS[elRoute.value] || [];
    elSta.innerHTML = '<option value="">(選ばない)</option>';
    list.forEach(function(s){
      elSta.insertAdjacentHTML('beforeend','<option value="'+esc(s)+'">'+esc(s)+'</option>');
    });
    if (keep && list.indexOf(keep) >= 0) elSta.value = keep;
  }

  // 下書きを流し込む。路線が駅マスターに無い名前だったときは駅だけ残しても選べないので、
  // その場合は空のままにしてスタッフに選んでもらう。
  if (SPECS) {
    if (SPECS.route && STATIONS[SPECS.route]) { elRoute.value = SPECS.route; fillStations(SPECS.station); }
    if (SPECS.rentMax) elRent.value = SPECS.rentMax;
    if (SPECS.layout && LAYOUTS.indexOf(SPECS.layout) >= 0) elLay.value = SPECS.layout;
    if (SPECS.areaMin) elArea.value = SPECS.areaMin;
    if (SPECS.buildingAge) elAge.value = SPECS.buildingAge;
    if (SPECS.walk) elWalk.value = SPECS.walk;
    (SPECS.equipment || []).forEach(function(e){
      if (e === 'バス・トイレ別') elBt.checked = true;
      if (e === '独立洗面台') elWash.checked = true;
    });
    if (SPECS.source) {
      document.getElementById('specHint').insertAdjacentHTML('beforebegin',
        '<p class="draft">📄 '+esc(SPECS.source)+' のページから下書きを入れました。違っていれば直してください。</p>');
    }
  }

  function currentSpecs(){
    var r=elRoute.value, s=elSta.value, rent=elRent.value.trim(), lay=elLay.value;
    if(!r || !s) return null;                 // エリアが無い条件は登録しても検索されない
    if(!rent && !lay) return null;            // 駅だけでは粗すぎる
    var eq=[];
    if(elBt.checked) eq.push(elBt.value);
    if(elWash.checked) eq.push(elWash.value);
    return {route:r, station:s, rentMax:rent, layout:lay,
            areaMin:elArea.value, buildingAge:elAge.value, walk:elWalk.value, equipment:eq};
  }

  function specApplies(){
    if (REQ.items.length !== 1) return false;
    var r = document.querySelector('input[name="a'+REQ.items[0].n+'"]:checked');
    return !!r && r.value === 'closed';
  }

  function refreshSpec(){
    var on = specApplies();
    elSec.style.display = on ? 'block' : 'none';
    if (!on) return;
    var sp = currentSpecs();
    if (sp) {
      var parts=[sp.station+'駅'+(sp.walk?' 徒歩'+sp.walk+'分以内':'')];
      if(sp.rentMax) parts.push(sp.rentMax+'万円以下');
      if(sp.layout) parts.push(sp.layout+'以上');
      if(sp.areaMin) parts.push(sp.areaMin+'m²以上');
      if(sp.buildingAge) parts.push('築'+sp.buildingAge+'年以内');
      sp.equipment.forEach(function(e){ parts.push(e); });
      elPrev.className='spec-prev';
      elPrev.innerHTML='✅ 「'+esc(parts.join(' / '))+'」で<b>「この条件で探しますか？」の2択カード</b>が届きます。'
        + '<br>※ 賃料は SUUMO の刻み（20万まで0.5万単位）に切り上がります（12.3万 → 12.5万）。'
        + '<br>※ お客様がすでに条件を登録済みの場合は、カードは出ずお知らせだけになります。';
    } else {
      elPrev.className='spec-prev off';
      elPrev.innerHTML='路線・駅と、賃料か間取りのどちらかを入れると2択カードになります。'
        + '<br>このままなら<b>「お部屋を探す」だけの1択カード</b>が届きます（空欄でも送信できます）。';
    }
  }

  document.getElementById('specHint').textContent =
    'この物件に近い条件を入れると、お客様に「この条件で探しますか？」と聞くカードが届きます。面倒なら空のままで構いません。';
  elRoute.addEventListener('change', function(){ fillStations(''); refreshSpec(); });
  [elSta, elRent, elLay, elArea, elAge, elWalk, elBt, elWash].forEach(function(el){
    el.addEventListener('change', refreshSpec); el.addEventListener('input', refreshSpec);
  });
  REQ.items.forEach(function(j){
    Array.prototype.forEach.call(document.querySelectorAll('input[name="a'+j.n+'"]'), function(el){
      el.addEventListener('change', refreshSpec);
    });
  });
  refreshSpec();

  document.getElementById('submit').addEventListener('click', function(){
    var btn=this, note=document.getElementById('note'), err=document.getElementById('err');
    note.style.display='none'; err.style.display='none';
    var freeText = document.getElementById('freeText').value.trim();
    var answers = [];
    var missing = [];
    REQ.items.forEach(function(j){
      var r = document.querySelector('input[name="a'+j.n+'"]:checked');
      var l = document.querySelector('input[name="l'+j.n+'"]').value.trim();
      if(!r) missing.push(j.n);
      answers.push({n:j.n, answer:r?r.value:'', label:l});
    });
    if(!freeText && missing.length){
      err.textContent = missing.join('、')+'件目の答えが付いていません。';
      err.style.display='block'; return;
    }
    btn.disabled=true; btn.textContent='送信中…';
    google.script.run
      .withSuccessHandler(function(res){
        if(res && res.ok){
          note.innerHTML = res.immediate
            ? '✅ お客様にLINEを送信しました（'+esc(res.scheduledAt||'')+'）。<br>送り直すと、もう1通届きます。このタブは閉じてOKです。'
            : '✅ 回答を受け付けました。自社シートの要確認物件を含むので、お客様へのLINEは <b>'+(res.scheduledAt?esc(res.scheduledAt)+'以降':'しばらくしてから')+'</b> に送信されます。<br>それまでに送り直せば、あとの回答で差し替わります。このタブは閉じてOKです。';
          note.style.display='block';
          btn.textContent='送信済み（送り直す）'; btn.disabled=false;
        } else {
          err.textContent = (res && res.message) || '不明なエラー';
          err.style.display='block'; btn.disabled=false; btn.textContent='お客様に送信する';
        }
      })
      .withFailureHandler(function(e){
        err.textContent = '送信に失敗しました: '+(e && e.message ? e.message : e);
        err.style.display='block'; btn.disabled=false; btn.textContent='お客様に送信する';
      })
      .submitVacancyAnswerForm(REQ.id, API_KEY, JSON.stringify({
        answers:answers,
        comment:document.getElementById('comment').value.trim(),
        freeText:freeText,
        // 自分で書いて返すときはカードを出さないので条件も送らない
        specs:(freeText || !specApplies()) ? null : currentSpecs()
      }));
  });
</script>
</body>
</html>
